<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner App Mockup</title>
<style>
:root{--ink:#1b2333;--muted:#6b778c;--line:#e3e8f1;--accent:#3d7bff;--accent2:#7a5cff;
--cortex:#2fb6ff;--aegis:#ff7d24;--swarm:#6bdc3a;--null:#c95cff;--neutral:#fff0c2;
--gold1:#7a5a12;--gold2:#f6d77a;--gold3:#b8862a;--gold4:#fff1b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#d9e1ee;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:default}
.phone{-webkit-user-select:none;user-select:none;position:relative;width:390px;height:844px;margin:24px auto;border-radius:44px;overflow:hidden;overflow:clip;background:linear-gradient(180deg,#e4eeff 0%,#f5f7fc 42%,#f3f5fa 100%);box-shadow:0 30px 80px rgba(20,40,80,.25),0 0 0 10px #10131b}
@media (max-width:430px){.phone{width:100vw;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none}}
#app{position:absolute;inset:0}

/* ---------- title screen ---------- */
.title{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 30%,#2a2f7a 0%,#12153a 45%,#05060f 100%);overflow:hidden;color:#fff;transition:opacity .6s,transform .6s;cursor:pointer}
.title.out{opacity:0;transform:scale(1.08);pointer-events:none}
.aurora{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(60px);opacity:.5;mix-blend-mode:screen;pointer-events:none}
.a1{background:#7a5cff;left:-150px;top:-90px;animation:drift1 12s ease-in-out infinite alternate}
.a2{background:#2fb6ff;right:-170px;top:230px;animation:drift2 14s ease-in-out infinite alternate}
.a3{background:#ff7d24;left:10px;bottom:-230px;opacity:.28;animation:drift1 16s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(120px,80px) scale(1.2)}}
@keyframes drift2{to{transform:translate(-100px,-60px) scale(.9)}}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 30% 82%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 88% 66%,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 62% 28%,rgba(160,200,255,.7),transparent),radial-gradient(1px 1px at 45% 55%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 8% 60%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 92% 40%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 55% 92%,rgba(255,255,255,.5),transparent);animation:tw 3s ease-in-out infinite alternate}
.tcards{position:absolute;left:50%;top:150px;width:0;height:0}
.fc{position:absolute;width:112px;left:-56px;top:0;transform-origin:50% 160%;transform:translateX(var(--x)) rotate(var(--r));animation:fanin 1.2s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d)}
.fc .fl{animation:float2 4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes fanin{from{transform:translateX(0) rotate(0) translateY(90px);opacity:0}}
@keyframes float2{50%{translate:0 -10px}}
.logo{position:absolute;left:0;right:0;top:390px;text-align:center;animation:logoin 1s .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes logoin{from{opacity:0;transform:scale(.7)}}
.lg{font:900 64px/1 system-ui;letter-spacing:.06em;background:linear-gradient(100deg,#fff 0%,#cfe0ff 30%,#fff 45%,#ffe9a8 55%,#fff 70%,#cfe0ff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 4s linear infinite;filter:drop-shadow(0 0 18px rgba(122,92,255,.75))}
.ls{font:800 13px system-ui;letter-spacing:.5em;color:#ffd86b;margin-top:10px;padding-left:.5em}
.tg{font:600 12px system-ui;color:rgba(255,255,255,.7);margin-top:12px}
.tap{position:absolute;left:0;right:0;bottom:120px;text-align:center;font:800 15px system-ui;letter-spacing:.22em;animation:blink 1.6s ease-in-out infinite}
.tap small{display:block;font:600 11px system-ui;letter-spacing:0;color:rgba(255,255,255,.6);margin-top:8px}
@keyframes blink{50%{opacity:.35}}
.ver{position:absolute;left:0;right:0;bottom:26px;text-align:center;font:600 10px system-ui;color:rgba(255,255,255,.45)}
.signin{position:absolute;left:16px;right:16px;bottom:22px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:18px;transform:translateY(130%);transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:default}
.signin.on{transform:none}
.signin h3{margin:0 0 4px;font-size:18px}
.signin input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.28);color:#fff;font:15px system-ui;margin-top:9px;outline:none}
.signin input::placeholder{color:rgba(255,255,255,.5)}
.signin .openbtn{width:100%;margin-top:14px}
.signin .alt{display:block;width:100%;text-align:center;margin-top:12px;font:600 12px system-ui;color:#9fd0ff}
.title.signing .tap{display:none}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;overflow:clip;display:flex;flex-direction:column;animation:scrin .28s ease}
@keyframes scrin{from{opacity:0;transform:translateY(10px)}}
.hdr{height:58px;display:flex;align-items:center;gap:8px;padding:10px 14px 0;flex:none}
.hdr .ttl{font:800 18px system-ui}
.sp{flex:1}
.oav{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#3d7bff,#7a5cff);color:#fff;font:900 17px system-ui;display:grid;place-items:center;flex:none}
.who b{display:block;font-size:15px;line-height:1.1}.who small{font:600 10px system-ui;color:var(--muted)}
.back{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(30,50,90,.1);font:900 22px/1 system-ui;display:grid;place-items:center;flex:none;padding-bottom:3px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 26px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.curs{display:flex;gap:6px}
.cur{display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:4px 10px 4px 4px;font:800 12px system-ui;box-shadow:0 2px 8px rgba(30,50,90,.08)}
.cur i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:900 9px system-ui;font-style:normal;color:#fff}
.cur .cr{background:linear-gradient(135deg,#f6c445,#e0902a)}
.cur .pp{background:linear-gradient(135deg,#7a5cff,#3d7bff)}
.bell{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(30,50,90,.08);position:relative;flex:none}
.bell svg{width:18px;height:18px}
.bell b{position:absolute;top:-3px;right:-3px;background:#ff4d6d;color:#fff;font:800 10px system-ui;border-radius:999px;padding:1px 5px}
.scr.dark{background:radial-gradient(circle at 50% 38%,#26336f 0%,#0e1232 58%,#05060f 100%);color:#fff}
.scr.dark .back{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.scr.dark .cur{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}

/* shared ui */
h4{margin:16px 2px 6px;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.panel{background:#fff;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 4px 14px rgba(30,50,90,.07)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ph b{font-size:15px}.ph span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}
.note{font-size:11px;color:var(--muted);text-align:center;margin:16px 0 0}
.btn{background:#eef2fa;border-radius:12px;padding:8px 13px;font-weight:700;font-size:13px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(61,123,255,.3)}
.btn.warn{background:#ffe9ec;color:#c4243f}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:#e6ebf4;border-radius:12px;padding:3px;margin:10px 0 4px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font:700 12px system-ui;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(30,50,90,.1)}
.pills{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.pill{flex:none;padding:6px 12px;border-radius:999px;background:#fff;font:700 12px system-ui;color:var(--muted);box-shadow:0 1px 4px rgba(30,50,90,.08)}
.pill.on{background:var(--ink);color:#fff}
.pill.off{opacity:.5}
.av{display:grid;place-items:center;font-weight:900;color:#1b2333;flex:none}
.chip{display:inline-block;font:800 10px system-ui;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 24%,#fff);color:color-mix(in srgb,var(--c) 55%,#000)}
.bar{height:7px;background:#e9edf5;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.q{display:flex;gap:8px;align-items:center;padding:5px 0}
.q>span:first-child{width:150px;font-size:13px}
.rr{width:26px;height:26px;border-radius:50%;background:#eef2fa;font-weight:900}
.toggle{width:46px;height:28px;border-radius:99px;background:#d5dbe6;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle.on{background:var(--accent)}.toggle.on::after{left:21px}
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set>div:first-child{flex:1}.set small{display:block;color:var(--muted);font-size:11px}
.fpick{padding:7px 14px;border-radius:999px;background:#fff;border:2px solid #e3e8f1;font:700 13px system-ui}
.fpick.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#fff)}
.openbtn{display:block;width:230px;margin:12px auto 0;padding:14px 0;border-radius:999px;font:900 16px system-ui;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 24px rgba(61,123,255,.35);position:relative}
.segs{display:flex;gap:4px;margin-bottom:5px}
.segs i{flex:1;height:8px;border-radius:99px;background:#dde3ee}
.segs i.f{background:linear-gradient(90deg,#f6c445,#ff9f43)}
.lb{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.lb:first-of-type{border-top:0}
.lb .pos{width:18px;font-weight:900;color:var(--muted)}
@keyframes bob{50%{translate:0 -6px}}

/* ---------- main menu ---------- */
.ahero{position:relative;border-radius:22px;padding:14px;color:#fff;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 65%,#1b1f3a),#141833 78%);box-shadow:0 10px 26px rgba(30,40,90,.25);margin-top:6px}
.ahero::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 60%,transparent),transparent 70%);pointer-events:none}
.ahero .nm{font:900 20px system-ui}
.ahero .meta{font:600 12px system-ui;opacity:.8}
.lv{display:inline-flex;gap:7px;align-items:center;font:700 12px system-ui;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;margin-top:10px;position:relative;z-index:1}
.dot{width:8px;height:8px;border-radius:50%;background:#ff3b5c;animation:blink 1.2s infinite}
.dot.idle{background:#9be15d;animation:none}
.ahero .btn{position:relative;z-index:1}
.ahero .chip{background:rgba(255,255,255,.18);color:#fff}
.pbn{display:flex;align-items:center;gap:12px;margin-top:12px;background:linear-gradient(135deg,#fff6dc,#fff);border-radius:18px;padding:10px 12px 10px 12px;box-shadow:0 4px 14px rgba(30,50,90,.07);border:1px solid #f3e2a9}
.pbn .mp{width:46px;height:72px;position:relative;container-type:inline-size;flex:none;animation:bob 3s ease-in-out infinite}
.pbn b{display:block;font-size:14px}.pbn span{font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:#fff;border-radius:20px;padding:14px;text-align:left;box-shadow:0 4px 14px rgba(30,50,90,.08);display:flex;flex-direction:column;gap:6px;min-height:112px;position:relative;overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--g);flex:none}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:15px}.tile span{font-size:11px;color:var(--muted);line-height:1.3}
.tile.wide{grid-column:1/-1;min-height:104px;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,#1c2350,#2b2166);color:#fff}
.tile.wide span{color:rgba(255,255,255,.72)}
.tile.sm{min-height:62px;flex-direction:row;align-items:center;gap:10px;padding:10px 12px}
.tile.sm .ic{width:34px;height:34px;border-radius:11px}
.tbdg{position:absolute;top:10px;right:10px;font:900 9px system-ui;letter-spacing:.1em;border-radius:999px;padding:3px 8px;background:#ff3b5c;color:#fff}
.tbdg.y{background:#ffcf5c;color:#3a2604}
.mb{margin-left:auto;display:grid;grid-template-columns:repeat(3,20px);gap:4px}
.mb i{height:28px;border-radius:4px;background:linear-gradient(160deg,#3a4fb0,#1b2460);border:1px solid rgba(255,255,255,.25);animation:mbp 2.4s ease-in-out infinite}
.mb i:nth-child(2){animation-delay:.4s}.mb i:nth-child(3){animation-delay:.8s}.mb i:nth-child(4){animation-delay:1.2s}.mb i:nth-child(5){animation-delay:1.6s}.mb i:nth-child(6){animation-delay:2s}
@keyframes mbp{50%{box-shadow:0 0 10px #8fd8ff;border-color:#8fd8ff}}

/* ---------- agent match ---------- */
.pbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:16px;padding:8px 10px;position:relative}
.pbar .nmx{font:800 13px system-ui;min-width:76px}
.pbar .nmx small{display:block;font:600 10px system-ui;opacity:.7}
.hpb{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.hpb i{display:block;height:100%;background:linear-gradient(90deg,#3cc47c,#9be15d);transition:width .4s}
.hpb.opp i{background:linear-gradient(90deg,#ff5d73,#ff9f6b)}
.hpn{font:900 16px system-ui;min-width:24px;text-align:right}
.hand{font:700 11px system-ui;opacity:.75}
.lane{display:flex;justify-content:center;gap:8px;min-height:106px;align-items:center;margin:8px 0}
.unit{width:68px;position:relative;transition:transform .2s}
.unit.fresh{animation:drop .45s cubic-bezier(.2,.8,.3,1)}
@keyframes drop{from{transform:translateY(-24px) scale(1.25);opacity:0}}
.unit.hit{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.unit.atk0{transform:translateY(-14px)}.unit.atk1{transform:translateY(14px)}
.uhp{position:absolute;right:-4px;bottom:-5px;background:#ff3b5c;color:#fff;font:900 10px system-ui;border-radius:999px;padding:1px 6px;z-index:2}
.dmg{position:absolute;left:50%;top:20%;transform:translateX(-50%);font:900 22px system-ui;color:#ff5d73;text-shadow:0 2px 6px #000;animation:dmg .9s forwards;pointer-events:none;z-index:5}
@keyframes dmg{to{top:-20%;opacity:0}}
.mid{text-align:center;font:800 11px system-ui;letter-spacing:.1em;color:#ffd86b;padding:5px 0;border-top:1px dashed rgba(255,255,255,.15);border-bottom:1px dashed rgba(255,255,255,.15)}
.log{background:rgba(0,0,0,.28);border-radius:14px;padding:8px 12px;font-size:12px;margin-top:10px;min-height:76px}
.log div{opacity:.55;padding:1px 0}.log div:first-child{opacity:1;font-weight:700}
.search{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:110px;text-align:center}
.radar{width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.2);position:relative;display:grid;place-items:center}
.radar::before,.radar::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #7a5cff;animation:ping 1.6s ease-out infinite}
.radar::after{animation-delay:.8s}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(1.8);opacity:0}}
.mres{text-align:center;padding:16px;background:rgba(255,255,255,.08);border-radius:18px;margin-top:10px;animation:pop .4s}
.mres h3{font:900 30px system-ui;letter-spacing:.14em;margin:0 0 6px}
.dbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 13px;font-weight:700;font-size:13px}
.dbtn.on{background:#fff;color:var(--ink)}
.spark{width:100%;height:70px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.sgrid div{background:#f3f6fb;border-radius:12px;padding:8px;text-align:center}
.sgrid b{display:block;font-size:17px}.sgrid span{font-size:10px;color:var(--muted)}
.wl{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:900 11px system-ui;color:#fff;flex:none}
.cand{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:2px solid #e3e8f1;background:#fff;margin-top:8px;cursor:pointer;text-align:left;width:100%}
.cand.on{border-color:var(--accent);background:#f2f6ff}
.sigpick{display:flex;gap:8px;margin-top:10px}
.sigpick>div{flex:1;border-radius:12px;padding:4px;border:2px solid transparent;cursor:pointer}
.sigpick>div.on{border-color:var(--accent);background:#eef3ff}
.prize{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prize:first-of-type{border-top:0}
.prize i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font:900 11px system-ui;flex:none}
.tier{background:#f3f6fb;border-radius:14px;padding:12px;text-align:center;opacity:.6}
.tier b{display:block;font-size:15px}
.shoppack{width:120px;height:189px;position:relative;container-type:inline-size;flex:none;margin:0 auto}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.si{background:#f3f6fb;border-radius:14px;padding:8px}
.si .pv{height:84px;border-radius:10px;margin-bottom:6px}
.soon{font:700 10px system-ui;color:var(--muted)}
.ring2{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#e6ebf4 0);display:grid;place-items:center;flex:none}
.ring2 b{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font:900 14px system-ui}

/* v4 additions */
.autorow{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff}
.autorow>div:first-child{flex:1}.autorow b{font-size:13px}.autorow small{display:block;opacity:.75;font-size:11px}
.autorow.lt{background:#f3f6fb;color:var(--ink)}
.tile.dk{background:linear-gradient(135deg,#1c2350,#2b2166);color:#fff}
.tile.dk2{background:linear-gradient(135deg,#3a1030,#7a2246);color:#fff}
.tile.dk span,.tile.dk2 span{color:rgba(255,255,255,.75)}
.scr.dark .seg{background:rgba(255,255,255,.1)}
.scr.dark .seg button{color:rgba(255,255,255,.7)}
.scr.dark .seg button.on{background:#fff;color:var(--ink)}
.scr.dark h4{color:rgba(255,255,255,.6)}
.frow{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:16px;padding:10px;margin-top:8px}
.frow .vs{flex:1;min-width:0}.frow .vs b{font-size:13px}.frow small{display:block;font-size:11px;opacity:.7}
.ftag{display:inline-block;font:900 9px system-ui;letter-spacing:.1em;padding:2px 7px;border-radius:999px;background:#ffcf5c;color:#3a2604;margin-bottom:3px}
.ftag.tr{background:#8fd8ff;color:#0b2b4a}
.spd{font:700 11px system-ui;opacity:.8}

/* pack face (sizes in cqw of the pack's container) */
.pf{position:absolute;inset:0;border-radius:3.5cqw;overflow:hidden;background:linear-gradient(165deg,#161d3a 0%,#2b2166 48%,#0e2c4d 100%);box-shadow:0 18px 40px rgba(20,20,60,.35);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pf .crimp{position:absolute;left:0;right:0;height:7%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 3px,rgba(255,255,255,.05) 3px 6px),linear-gradient(180deg,#c3cce3,#6c7899)}
.pf .crimp.t{top:0}.pf .crimp.b{bottom:0}
.pfl{font:900 6cqw system-ui;letter-spacing:.3em;opacity:.85;margin-bottom:3cqw}
.pf svg{width:56%}
.pfs{font:900 16cqw system-ui;letter-spacing:.14em;margin-top:3cqw;background:linear-gradient(90deg,#fff,#cfe0ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pfd{font:700 5.2cqw system-ui;letter-spacing:.12em;opacity:.75;text-transform:uppercase;margin-top:1cqw}
.holo{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 42%,rgba(160,220,255,.18) 48%,transparent 60%);background-size:260% 100%;animation:sweep 3s linear infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes sweep{from{background-position:130% 0}to{background-position:-130% 0}}
.pbadge{position:absolute;top:11%;right:8%;background:#ff4d6d;color:#fff;font:900 7cqw system-ui;border-radius:2cqw;padding:.5cqw 2.5cqw}

/* tilt + glare */
.tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .15s ease-out}
.glare{position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at var(--gx,50%) var(--gy,25%),rgba(255,255,255,.42),transparent 45%);mix-blend-mode:overlay;pointer-events:none}

/* card (sizes in cqw of the card width) */
.tc{position:relative;width:100%;aspect-ratio:5/7;container-type:inline-size}
.tci{position:absolute;inset:0;border-radius:5cqw;overflow:hidden;background:linear-gradient(160deg,#2d3448,#161a26);border:1.4cqw solid var(--fc);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tci .art{position:absolute;left:4cqw;right:4cqw;top:15cqw;height:58cqw;border-radius:3cqw;background-size:cover;background-position:center}
.hd{position:absolute;left:4cqw;right:4cqw;top:3cqw;height:11cqw;display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.hd .nm{font:800 6.4cqw/1 system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cost{width:9.5cqw;height:9.5cqw;border-radius:50%;display:grid;place-items:center;font:900 5.5cqw system-ui;background:radial-gradient(circle at 35% 30%,#fff,#9fd8ff 40%,#2b6fa8);color:#0b1a2a;flex:none}
.ty{position:absolute;left:4cqw;right:4cqw;top:75cqw;height:7.5cqw;padding:0 2.5cqw;border-radius:2cqw;background:rgba(0,0,0,.35);display:flex;justify-content:space-between;align-items:center;font:600 4.2cqw system-ui;color:#dfe4ef}
.tx{position:absolute;left:4cqw;right:4cqw;top:84.5cqw;height:23cqw;padding:2.5cqw 3cqw;border-radius:2cqw;background:rgba(0,0,0,.28);font:4.4cqw/1.3 system-ui;color:#d6dbe7}
.st{position:absolute;right:4cqw;bottom:10.5cqw;display:flex;gap:1.6cqw}
.st b{min-width:9cqw;height:7.5cqw;padding:0 1.5cqw;border-radius:2cqw;display:grid;place-items:center;font:900 5cqw system-ui;background:#0c0f16;border:.4cqw solid rgba(255,255,255,.2)}
.ft{position:absolute;left:4cqw;right:4cqw;bottom:3cqw;height:6cqw;display:flex;justify-content:space-between;align-items:center;font:600 4cqw system-ui;color:#b9c1d3}
.sn{display:flex;align-items:center;gap:1.5cqw;color:#dfe4ef;font-variant-numeric:tabular-nums}
.sn svg{width:4.6cqw;height:4.6cqw}
.plate{position:absolute;left:4cqw;bottom:10.5cqw;font:900 4.8cqw system-ui;padding:.8cqw 2.6cqw;border-radius:1.6cqw;color:#3a2604;background:linear-gradient(110deg,var(--gold1),var(--gold2),var(--gold3),var(--gold4),var(--gold3),var(--gold2));background-size:250% 100%;animation:sweep 3s linear infinite;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.stamp{position:absolute;left:4cqw;bottom:10.5cqw;font:800 3.6cqw system-ui;letter-spacing:.08em;padding:1cqw 2.6cqw;border-radius:99px;background:rgba(255,255,255,.92);color:#20242e}
.foilt{background:linear-gradient(110deg,var(--gold1) 0%,var(--gold2) 22%,var(--gold3) 40%,var(--gold4) 50%,var(--gold3) 60%,var(--gold2) 78%,var(--gold1) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 3s linear infinite;font-weight:900}
.tc.sheen .tci::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.28) 40%,rgba(140,220,255,.22) 47%,rgba(255,180,255,.2) 53%,transparent 66%);background-size:250% 100%;animation:sweep 2.6s linear infinite;mix-blend-mode:screen;pointer-events:none}
.tc.full .tci .art{left:0;right:0;top:0;bottom:0;height:auto;border-radius:0}
.tc.full .ty,.tc.full .tx{background:rgba(6,8,14,.55);backdrop-filter:blur(1.5px)}
.tc.alt .art{filter:hue-rotate(35deg) saturate(1.35) contrast(1.1)}
.tc.gold .tci{background:linear-gradient(150deg,#5c440f,#c9a24a 35%,#7d5c16 60%,#e6c56a 85%,#5c440f);border-color:#fff1b8}
.tc.gold .art{filter:sepia(1) saturate(2.2) hue-rotate(-12deg) brightness(1.05)}
.tc.gold .ty,.tc.gold .tx{background:rgba(40,28,4,.45);color:#fff3cf}
.tc.gold .ft,.tc.gold .sn{color:#fff3cf}
.tc.proto .tci{border-color:#e9c46a;box-shadow:inset 0 0 0 .7cqw #7a5a12,0 4px 14px rgba(0,0,0,.3)}

/* card back */
.cb{position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 50% 45%,#3a4fb0 0,#1b2460 42%,#0b1030 100%);border:4px solid #dfe6ff;display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:inline-size;color:#dfe6ff}
.cb::before{content:"";position:absolute;inset:6%;border:1.5px solid rgba(255,255,255,.22);border-radius:8px}
.cb svg{width:34cqw;margin-bottom:4cqw}
.cb span{font:900 9cqw system-ui;letter-spacing:.14em}
.cb.glow{box-shadow:0 0 30px 8px var(--gl),0 0 70px 22px color-mix(in srgb,var(--gl) 45%,transparent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 44px 14px var(--gl),0 0 100px 34px color-mix(in srgb,var(--gl) 45%,transparent)}}

/* overlay: pack opening */
.ov{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:radial-gradient(circle at 50% 42%,#2c3d80 0%,#141a3a 46%,#070a18 100%);color:#fff;overflow:hidden}
.ov.on{display:flex}
.ov::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 30% 82%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 88% 66%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 62% 28%,rgba(160,200,255,.6),transparent),radial-gradient(1px 1px at 45% 55%,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 8% 60%,rgba(255,255,255,.5),transparent);animation:tw 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes tw{to{opacity:.35}}
.ovtop{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;height:56px;z-index:3;position:relative}
.ovtitle{font:800 14px system-ui;letter-spacing:.04em}
.ovbtn{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font:700 12px system-ui;color:#fff}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;perspective:1000px;touch-action:none}
.stage.scroll{display:block;overflow-y:auto;padding:4px 14px 10px;touch-action:auto;scrollbar-width:none}
.hint{min-height:74px;text-align:center;font:600 13px system-ui;color:rgba(255,255,255,.78);padding:0 20px;z-index:3;position:relative}
.hint .slot{display:inline-block;font:800 10px system-ui;letter-spacing:.16em;color:#ffd86b;margin-bottom:6px}
.link{color:#9fd0ff;text-decoration:underline;font-size:12px;margin-top:6px}
.cp{position:absolute;left:50%;top:50%;width:170px;height:268px;margin:-160px 0 0 -85px;transition:transform .35s ease,opacity .35s;container-type:inline-size;cursor:pointer;perspective:800px}
.cp .tilt{position:absolute;inset:0}
.cpgo{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:210px;z-index:20}
.pk{position:relative;width:210px;height:330px;container-type:inline-size;touch-action:none;cursor:grab}
.pk .pc{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.4,1),opacity .6s}
.pk .pc.top{clip-path:inset(0 0 86% 0)}
.pk .pc.bot{clip-path:inset(14% 0 0 0)}
.pkstack{position:absolute;inset:0;border-radius:3.5cqw;background:linear-gradient(165deg,#1d2550,#2b2166);transform:translate(10px,8px) rotate(4deg);opacity:.8;transition:opacity .4s}
.pkstack.s2{transform:translate(-10px,10px) rotate(-5deg);opacity:.55}
.cut{position:absolute;left:0;right:0;top:14%;border-top:2px dashed rgba(255,255,255,.6);z-index:2}
.cut i{position:absolute;left:0;top:-3px;height:4px;width:0;background:#fff;box-shadow:0 0 12px 4px #9fd0ff,0 0 26px 8px #7a5cff;border-radius:4px}
.finger{position:absolute;top:calc(14% - 13px);left:6%;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 14px #fff;animation:swipehint 1.6s ease-in-out infinite;z-index:3;pointer-events:none}
@keyframes swipehint{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{transform:translateX(160px);opacity:1}100%{transform:translateX(170px);opacity:0}}
.pk.done .finger,.pk.done .cut{display:none}
.pk.done .top{transform:translate(90px,-160px) rotate(24deg);opacity:0}
.pk.done .bot{transform:translateY(110px) scale(.95);opacity:0;transition-delay:.35s}
.pk.done .pkstack{opacity:0}
.rc{position:absolute;left:50%;top:50%;width:250px;height:350px;margin:-190px 0 0 -125px;perspective:1000px;touch-action:none;transition:transform .28s ease,opacity .28s;cursor:pointer;animation:rise .45s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(60px) scale(.9);opacity:0}}
.rc.drag{transition:none}
.rc.behind{transform:translate(7px,9px) scale(.97);opacity:.85;pointer-events:none;animation:none}
.rc.behind2{transform:translate(14px,18px) scale(.94);opacity:.55;pointer-events:none;animation:none}
.rc .tilt{position:absolute;inset:0}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.flip.down{transform:rotateY(180deg)}
.face,.backf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.backf{transform:rotateY(180deg)}
.banner{position:absolute;left:0;right:0;top:44%;text-align:center;font:900 32px/1.1 system-ui;letter-spacing:.1em;opacity:0;pointer-events:none;z-index:6;padding:0 16px}
.banner .wt{color:#fff;text-shadow:0 0 20px #8fd8ff,0 0 40px #7a5cff}
.banner.go{animation:ban 1.5s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.08)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,var(--c),transparent 62%);mix-blend-mode:screen;animation:wash 1s ease-out forwards}
@keyframes wash{0%{opacity:.95}100%{opacity:0}}
.ring{position:absolute;left:50%;top:45%;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid var(--c);animation:ring .9s ease-out forwards}
@keyframes ring{to{transform:scale(22);opacity:0}}
.pt{position:absolute;left:50%;top:45%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);transform:rotate(var(--a));animation:pt 1s ease-out forwards}
@keyframes pt{to{transform:rotate(var(--a)) translateX(var(--d));opacity:0}}
.res{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;padding:12px 4px 4px}
.ri{width:30%;position:relative;cursor:pointer;animation:pop .4s backwards;animation-delay:calc(var(--i)*80ms)}
@keyframes pop{from{transform:translateY(24px) scale(.8);opacity:0}}
.new{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#ff4d6d;color:#fff;font:900 9px system-ui;letter-spacing:.08em;border-radius:999px;padding:2px 7px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.new.sm{font-size:7px;padding:1px 4px;top:-4px}
.ppc{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:#7a5cff;color:#fff;font:800 9px system-ui;border-radius:999px;padding:2px 7px;z-index:2;white-space:nowrap}
.resfoot{text-align:center;margin:16px 0 10px;font-size:13px}
.resbtns{display:flex;gap:10px;justify-content:center;padding:0 0 12px}
.ovbig{flex:1;max-width:170px;padding:13px 0;border-radius:999px;font:800 14px system-ui;background:rgba(255,255,255,.14);color:#fff}
.ovbig.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(61,123,255,.4)}
.bulkhead{text-align:center;font:700 13px system-ui;color:#ffe08a;margin:4px 0 12px}
.bulk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 7px}
.bi{position:relative;aspect-ratio:5/7;perspective:600px;cursor:pointer;animation:pop .35s backwards;animation-delay:calc(var(--i)*22ms)}
.bi .cb{border-radius:6px;border-width:2px}
.bi .cb::before{border-radius:4px}
.bi .cb.glow{box-shadow:0 0 10px 3px var(--gl);animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 18px 6px var(--gl)}}

/* binder */
.prog{display:flex;align-items:center;gap:14px}
.ringp{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#e6ebf4 0);display:grid;place-items:center;flex:none}
.ringp b{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font:900 14px system-ui}
.binder{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;margin-top:10px}
.bc{position:relative;cursor:pointer}
.bc .cnt{position:absolute;right:-3px;bottom:-5px;background:#1b2333;color:#fff;font:800 9px system-ui;border-radius:999px;padding:1px 6px;z-index:2}
.bc .lbl{font:600 9px system-ui;color:var(--muted);text-align:center;margin-top:3px}
.miss{aspect-ratio:5/7;border-radius:8px;background:repeating-linear-gradient(135deg,#eceff6 0 6px,#e3e7f0 6px 12px);border:1.5px dashed #c7cfdd;display:grid;place-items:center;text-align:center;font:800 11px system-ui;color:#9aa4b8}
.miss.gold{border-color:#d9b552;background:#fbf4de;color:#b08a2e}

/* sheet, viewer, toast */

.dim{position:absolute;inset:0;background:rgba(15,20,35,.38);z-index:30;display:none}.dim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#f6f8fc;border-radius:24px 24px 0 0;padding:10px 16px 26px;z-index:31;transform:translateY(105%);transition:transform .3s ease}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#cdd5e3;margin:0 auto 12px}
.sigc{width:130px;margin:0 auto;cursor:pointer}
.vw{position:absolute;inset:0;z-index:40;background:rgba(6,9,20,.86);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.vw.on{display:flex}
.vwc{width:250px;height:350px;perspective:1000px;position:relative}
.vwc .tilt{position:absolute;inset:0;animation:float 4s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}
.vwi{background:#fff;border-radius:18px;padding:12px 14px;width:100%;max-width:320px;color:var(--ink)}
.vwx{color:#fff;background:rgba(255,255,255,.14);border-radius:999px;padding:9px 22px;font-weight:700}
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:8px 14px;border-radius:12px;font:600 12px system-ui;z-index:60;display:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}


/* full-width menu rows */
.tiles{grid-template-columns:1fr;gap:9px}
.tiles .tile{flex-direction:row;align-items:center;gap:12px;min-height:70px;padding:12px 14px}
.tiles .tile .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tiles .tile .tbdg{position:static;flex:none}
.tiles .tile .chev{font:700 22px/1 system-ui;color:#b3bccc;flex:none;margin-left:2px}
.tiles .tile.dk .chev,.tiles .tile.dk2 .chev{color:rgba(255,255,255,.55)}

/* ---------- dark theme (cards, match board and pack opening look the same in both) ---------- */
.phone{color:var(--ink);transition:background .3s}
.phone.th-dark{--ink:#e8ecf5;--muted:#9aa4b8;--line:#262d45;background:linear-gradient(180deg,#151b36 0%,#0e1227 45%,#0b0f1e 100%)}
.th-dark .panel,.th-dark .tiles .tile:not(.dk):not(.dk2),.th-dark .cur,.th-dark .bell,.th-dark .back,.th-dark .pill,.th-dark .fpick,.th-dark .cand,.th-dark .vwi{background:#1a2140;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.th-dark .pill.on{background:#e8ecf5;color:#141a33}
.th-dark .btn{background:#262e52;color:var(--ink)}
.th-dark .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.th-dark .btn.warn{background:#3a1a24;color:#ff8a9c}
.th-dark .seg{background:#1a2140}
.th-dark .seg button.on{background:#2c3560;color:#fff;box-shadow:none}
.th-dark .sheet{background:#11162b}
.th-dark .grab{background:#38416a}
.th-dark .si,.th-dark .tier,.th-dark .sgrid div,.th-dark .autorow.lt{background:#232b4f;color:var(--ink)}
.th-dark .bar,.th-dark .segs i{background:#2a3256}
.th-dark .segs i.f{background:linear-gradient(90deg,#f6c445,#ff9f43)}
.th-dark .rr{background:#262e52;color:var(--ink)}
.th-dark .pbn{background:linear-gradient(135deg,#2e2814,#1a2140);border-color:#4a3f1c}
.th-dark .ring2{background:conic-gradient(var(--accent) calc(var(--p)*1%),#2a3256 0)}
.th-dark .ring2 b{background:#1a2140}
.th-dark .miss{background:repeating-linear-gradient(135deg,#1c2242 0 6px,#20274a 6px 12px);border-color:#38416a;color:#7c87a3}
.th-dark .miss.gold{background:#2b2614;border-color:#7a6326;color:#d9b552}
.th-dark .toggle:not(.on){background:#3a4366}
.th-dark .chip{background:color-mix(in srgb,var(--c) 22%,#1a2140);color:color-mix(in srgb,var(--c) 80%,#fff)}
.th-dark .tiles .tile .chev{color:#5d6886}
.th-dark .cand{border-color:#2a3256}
.th-dark .cand.on,.th-dark .sigpick>div.on{background:#22305e;border-color:var(--accent)}
.th-dark .bc .cnt{background:#e8ecf5;color:#141a33}
.th-dark .prize i{background:#262e52!important;color:var(--ink)!important}
.th-dark .prize:first-of-type i{background:#4a3f1c!important;color:#ffd86b!important}
.th-dark .fpick.on{background:color-mix(in srgb,var(--c) 22%,#1a2140)}
.themeseg{margin:4px 0 6px}

/* match board: fill the screen, centre the arena, always fit 4 units */
.scr.dark .body{display:flex;flex-direction:column}
#mboard{flex:1;display:flex;flex-direction:column;padding-top:8px}
.arena{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:430px}
.lane{gap:6px;padding:14px 2px;min-height:136px;margin:4px 0}
.unit{flex:0 1 76px;width:auto;min-width:0}
.unit.atk0{transform:translateY(-9px)}.unit.atk1{transform:translateY(9px)}
.uhp{right:-2px;bottom:-6px}
</style>
</head>

    <div class="ver">Mockup v0.4 · Season 0 · home network</div>

</div>
<script>
// ---------- helpers ----------
const $=s=>document.querySelector(s);
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}
function av(a,s){return avn(a.n,a.f,s)}
function avn(n,f,s){return `<div class="av" style="background:${FC[f]};width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px;border-radius:${Math.round(s*.32)}px">${n[0]}</div>`}
function bar(p,col){return `<div class="bar"><i style="width:${Math.min(100,p)}%;${col?'background:'+col:''}"></i></div>`}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return `${h}:${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function canOpen(){const a=AGENTS[cur];return daily>0||a.packs>0||a.cr>=100}
function bindTilt(el,t){
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    t.style.setProperty('--ry',((x-.5)*22).toFixed(1)+'deg');t.style.setProperty('--rx',((.5-y)*22).toFixed(1)+'deg');
    t.style.setProperty('--gx',(x*100).toFixed(0)+'%');t.style.setProperty('--gy',(y*100).toFixed(0)+'%')});
  el.addEventListener('pointerleave',()=>{t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg')});
}


// ---------- generated placeholder art ----------
const ARTC={};
function art(n,f,r){const k=n+'|'+f;if(ARTC[k])return ARTC[k];const R=rng(hash(n)),c=HEX[f],cx=30+R()*40,cy=30+R()*25,X=cx,Y=cy*.8;const F=v=>v.toFixed(1);
 let s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 80' preserveAspectRatio='xMidYMid slice'><defs><radialGradient id='g' cx='${F(cx)}%' cy='${F(cy)}%' r='55%'><stop offset='0' stop-color='#fff' stop-opacity='.9'/><stop offset='.12' stop-color='${c}' stop-opacity='.95'/><stop offset='.45' stop-color='${c}' stop-opacity='.25'/><stop offset='1' stop-color='${c}' stop-opacity='0'/></radialGradient></defs><rect width='100' height='80' fill='#090d1a'/><rect width='100' height='80' fill='${c}' opacity='.08'/><rect width='100' height='80' fill='url(#g)'/>`;
 if(f==='Cortex'){for(let i=0;i<=10;i++)s+=`<path d='M${i*10} 0V80M0 ${i*8}H100' stroke='${c}' stroke-opacity='.1' stroke-width='.4'/>`;
   for(let i=0;i<7;i++){const y=R()*80,x2=10+R()*80,y2=R()*80;s+=`<path d='M0 ${F(y)}H${F(x2)}V${F(y2)}H${F(x2+8+R()*20)}' fill='none' stroke='${c}' stroke-opacity='.6' stroke-width='.8'/><circle cx='${F(x2)}' cy='${F(y2)}' r='1.4' fill='${c}'/>`}}
 else if(f==='Aegis'){const hx=(x,y,q)=>[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i+Math.PI/6;return F(x+q*Math.cos(a))+','+F(y+q*Math.sin(a))}).join(' ');
   [9,16,24,33].forEach((q,i)=>s+=`<polygon points='${hx(X,Y,q)}' fill='none' stroke='${c}' stroke-opacity='${.8-i*.15}' stroke-width='${1.4-i*.2}'/>`);
   for(let i=0;i<8;i++)s+=`<polygon points='${hx(R()*100,R()*80,2+R()*3)}' fill='${c}' fill-opacity='${F(.15+R()*.35)}'/>`}
 else if(f==='Swarm'){for(let i=0;i<24;i++)s+=`<ellipse cx='${F(R()*100)}' cy='${F(R()*80)}' rx='${F(.8+R()*3.5)}' ry='${F(.8+R()*2.5)}' fill='${c}' fill-opacity='${F(.2+R()*.5)}'/>`;
   for(let i=0;i<3;i++)s+=`<path d='M0 ${F(R()*80)} Q ${F(X)} ${F(Y)} 100 ${F(R()*80)}' fill='none' stroke='${c}' stroke-opacity='.4' stroke-width='.7'/>`}
 else if(f==='Null'){for(let i=0;i<10;i++)s+=`<rect x='${F(R()*90)}' y='${F(R()*80)}' width='${F(8+R()*32)}' height='${F(.8+R()*2.5)}' fill='${R()<.3?'#fff':c}' fill-opacity='${F(.3+R()*.5)}'/>`;
   s+=`<circle cx='${F(X)}' cy='${F(Y)}' r='13' fill='none' stroke='${c}' stroke-width='1.4'/><circle cx='${F(X)}' cy='${F(Y)}' r='10' fill='#000'/>`}
 else {for(let i=0;i<18;i++){const a=i/18*Math.PI*2;s+=`<line x1='${F(X)}' y1='${F(Y)}' x2='${F(X+70*Math.cos(a))}' y2='${F(Y+70*Math.sin(a))}' stroke='${c}' stroke-opacity='.28' stroke-width='.8'/>`}
   s+=`<circle cx='${F(X)}' cy='${F(Y)}' r='14' fill='none' stroke='${c}' stroke-width='1.2'/><circle cx='${F(X)}' cy='${F(Y)}' r='4' fill='#fff'/>`}
 if(r==='M')s+=`<circle cx='${F(X)}' cy='${F(Y)}' r='30' fill='none' stroke='#fff' stroke-opacity='.5' stroke-width='.6' stroke-dasharray='2 2'/>`;
 s+='</svg>';
 return ARTC[k]=`url('data:image/svg+xml,${encodeURIComponent(s).replace(/'/g,'%27')}')`;
}
function statsFor(n,r){const R=rng(hash(n)+99),cost={C:1,U:2,R:3,M:5}[r]+Math.floor(R()*3);return{cost,atk:1+Math.floor(R()*(cost+1)),hp:1+Math.floor(R()*(cost+2)),tx:TXT[Math.floor(R()*TXT.length)]}}
const SYM='<svg viewBox="0 0 16 16"><path d="M8 1 14 4.5v7L8 15 2 11.5v-7z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/></svg>';
function cardHTML(c){const s=statsFor(c.n,c.r),fin=c.fin||'Standard',full=['Full Art','Alt Art','Prototype'].includes(fin);
 const cls=['tc',fin==='Foil'?'sheen':'',full?'full sheen':'',fin==='Alt Art'?'alt':'',fin==='Gold'?'gold sheen':'',fin==='Prototype'?'proto':''].join(' ');
 const num=fin==='Prototype'?'<span class="foilt">PROTOTYPE · S1</span>':c.promoNo?c.promoNo:fin==='Gold'?(121+(NUM[c.n]||0)%9)+'/120':String(NUM[c.n]||0).padStart(3,'0')+'/120';
 return `<div class="${cls}" style="--fc:${FC[c.f]}"><div class="tci"><div class="art" style="background-image:${art(c.n,c.f,c.r)}"></div>
 <div class="hd"><span class="nm">${c.n}</span><span class="cost">${s.cost}</span></div>
 <div class="ty"><span>Unit · ${c.f}</span><span>${RAR[c.r]} ${RN[c.r]}</span></div>
 <div class="tx">${c.txt||s.tx}</div><div class="st"><b>${s.atk}</b><b>${s.hp}</b></div>
 ${fin==='Prototype'?`<div class="plate">${c.serial||'07/50'}</div>`:''}${c.stamp?`<div class="stamp">${c.stamp}</div>`:''}
 <div class="ft"><span class="sn">${SYM}${num}</span><span>${c.promoNo?'Promo':fin==='Prototype'?'':'Set 1'}</span></div></div></div>`}
function backHTML(gl){return `<div class="cb ${gl?'glow':''}" ${gl?`style="--gl:${gl}"`:''}>${SYM}<span>AI·TCG</span></div>`}
const EMB='<svg viewBox="0 0 100 100"><path d="M50 6 88 28v44L50 94 12 72V28z" fill="none" stroke="url(#emb)" stroke-width="5"/><path d="M50 24 72 37v26L50 76 28 63V37z" fill="url(#emb)" opacity=".28"/><circle cx="50" cy="50" r="18" fill="none" stroke="#fff0c2" stroke-opacity=".5" stroke-width="1.5"/><circle cx="50" cy="50" r="11" fill="#fff0c2"/></svg>';
function packFace(b){return `<div class="pf"><div class="crimp t"></div><div class="pfl">AI·TCG</div>${EMB}<div class="pfs">SET 1</div><div class="pfd">Season 0 · 5 cards</div><div class="crimp b"></div><div class="holo"></div>${b?`<span class="pbadge">${b}</span>`:''}</div>`}
function sigOf(i){const a=AGENTS[i];return{n:a.sig,f:'Neutral',r:'M',fin:'Full Art',promoNo:'PR-001',stamp:'SIGNATURE',txt:'Signature card. Always in the deck without taking a slot.'}}
const isHit=c=>['Full Art','Alt Art','Gold','Prototype'].includes(c.fin)||c.r==='M';
const GL=c=>c.fin==='Prototype'?'#ffd65a':c.fin==='Gold'?'#ffcf5c':(c.fin==='Full Art'||c.fin==='Alt Art')?'#8fe3ff':'#e9c2ff';
function hitLabel(c){if(c.fin==='Prototype')return'PROTOTYPE';if(c.fin==='Gold')return'GOLD';if(c.r==='M')return c.fin==='Standard'||c.fin==='Foil'?'MYTHIC':'MYTHIC · '+c.fin.toUpperCase();return c.fin.toUpperCase()}
// ---------- pack opening ----------
function rollCard(slot,force){
  const pick=r=>{const l=POOL.filter(c=>c[2]===r);return l[Math.floor(Math.random()*l.length)]};
  let r=slot==='C'?'C':slot==='U'?'U':(Math.random()<1/8?'M':'R'),fin='Standard';
  if(slot==='S'){const x=Math.random();r=x<.45?'C':x<.8?'U':x<.97?'R':'M';const y=Math.random();fin=y<.56?'Standard':y<.86?'Foil':y<.96?'Full Art':y<.993?'Alt Art':'Gold'}
  if(force==='gold'&&slot==='S'){r='R';fin='Gold'}
  if(force==='jackpot')fin=['Foil','Full Art','Alt Art','Foil','Gold'][Math.floor(Math.random()*5)];
  if(fin==='Alt Art'&&(r==='C'||r==='U'))fin='Full Art';
  const c=pick(r);return{n:c[0],f:c[1],r:c[2],fin,slot}
}
function makePack(force){const p=['C','C','U','R','S'].map(s=>rollCard(s,force));
  if(force==='proto'||Math.random()<1/1000){const l=POOL.filter(c=>c[2]==='R'||c[2]==='M'),k=l[Math.floor(Math.random()*l.length)];p.push({n:k[0],f:k[1],r:k[2],fin:'Prototype',slot:'P',serial:'07/50'})}
  return p}
function startOpen(n,force){const a=AGENTS[cur];
  if(!force){
    if(n===1){if(daily>0){daily--;if(!dailyAt)dailyAt=Date.now()+DAY}else if(a.packs>0)a.packs--;else if(a.cr>=100)a.cr-=100;else{toast('No packs left');return}}
    else{if(a.packs<10){toast('Needs 10 unopened packs');return}a.packs-=10}
  }
  const packs=[];for(let i=0;i<n;i++)packs.push(makePack(force));
  OP={packs,mode:n>1?'bulk':'single',idx:0,cards:packs[0],applied:false};
  $('#vw').classList.remove('on');$('#ov').classList.add('on');$('#fx').innerHTML='';renderTop();
  n>1?tear():carousel();
}
function setOv(t,h){$('#ovtitle').textContent=t;const hi=$('#hint');hi.style.display='';hi.innerHTML=h;$('#skip').textContent='Skip';$('#banner').className='banner'}
function carousel(){sel=2;setOv('Choose a pack','Swipe to browse · tap the middle pack');const st=$('#stage');st.className='stage';
  st.innerHTML=[0,1,2,3,4].map(i=>`<div class="cp" data-i="${i}"><div class="tilt">${packFace()}<div class="glare"></div></div></div>`).join('')+`<button class="ovbig pri cpgo" onclick="tear()">Open this pack</button>`;
  placeCp();document.querySelectorAll('.cp').forEach(el=>bindTilt(el,el.querySelector('.tilt')));
  let sx=null;st.onpointerdown=e=>{sx=e.clientX};
  st.onpointerup=e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(dx>40)sel=Math.max(0,sel-1);else if(dx<-40)sel=Math.min(4,sel+1);else{const cp=e.target.closest('.cp');if(!cp)return;const i=+cp.dataset.i;if(i===sel){tear();return}sel=i}placeCp()}}
function placeCp(){document.querySelectorAll('.cp').forEach(el=>{const o=+el.dataset.i-sel,a=Math.abs(o);el.style.transform=`translateX(${o*118}px) scale(${a?.74:1}) rotateY(${o*-14}deg)`;el.style.zIndex=10-a;el.style.opacity=a>2?0:a===2?.45:1})}
function tear(){const st=$('#stage');st.onpointerdown=st.onpointerup=null;st.className='stage';const bulk=OP.mode==='bulk',b=bulk?'×'+OP.packs.length:'';
  setOv(bulk?`Opening ${OP.packs.length} packs`:'Open the pack','Slide your finger across the top of the pack<br><button class="link" onclick="cutPack()">or tap here</button>');
  st.innerHTML=`<div class="pk" id="pk">${bulk?'<div class="pkstack"></div><div class="pkstack s2"></div>':''}<div class="pc top">${packFace(b)}</div><div class="pc bot">${packFace(b)}</div><div class="cut"><i id="cutp"></i></div><div class="finger"></div></div>`;
  const pk=$('#pk');let x0=null,p=0;
  pk.onpointerdown=e=>{x0=e.clientX;pk.setPointerCapture(e.pointerId)};
  pk.onpointermove=e=>{if(x0===null)return;p=Math.max(p,(e.clientX-x0)/(pk.offsetWidth*.7));$('#cutp').style.width=Math.min(100,p*100)+'%';if(p>=1){x0=null;cutPack()}};
  pk.onpointerup=()=>{if(x0===null)return;x0=null;if(p<1){p=0;$('#cutp').style.width='0'}}}
function cutPack(){const pk=$('#pk');if(!pk||pk.classList.contains('done'))return;pk.classList.add('done');fxWash('#bfe3ff');$('#hint').innerHTML='';
  setTimeout(()=>{if(!OP)return;if(OP.mode==='bulk')bulk();else{OP.idx=0;show()}},950)}
function show(){if(!OP)return;const cs=OP.cards,c=cs[OP.idx];if(!c){results();return}
  const st=$('#stage');st.className='stage';
  if(c.slot==='P'&&!c.intro){c.intro=true;st.innerHTML='';setOv('Bonus card','');banner('A 6TH CARD?!',true);fxWash('#ffd65a');setTimeout(show,1500);return}
  const down=isHit(c)&&!c.rev,left=cs.length-OP.idx-1;
  setOv(`Card ${OP.idx+1} of ${cs.length}`,'');
  st.innerHTML=(left>1?`<div class="rc behind2">${backHTML()}</div>`:'')+(left>0?`<div class="rc behind">${backHTML()}</div>`:'')+
   `<div class="rc" id="rc"><div class="tilt"><div class="flip ${down?'down':''}"><div class="face">${cardHTML(c)}</div><div class="backf">${backHTML(down?GL(c):'')}</div></div><div class="glare"></div></div></div>`;
  hintFor(c,down);
  const rc=$('#rc');bindTilt(rc,rc.querySelector('.tilt'));let s=null;
  rc.onpointerdown=e=>{s={x:e.clientX,y:e.clientY};rc.setPointerCapture(e.pointerId);rc.classList.add('drag')};
  rc.onpointermove=e=>{if(!s||rc.querySelector('.flip.down'))return;const dx=e.clientX-s.x,dy=e.clientY-s.y;rc.style.transform=`translate(${dx}px,${dy*.4}px) rotate(${dx/18}deg)`};
  rc.onpointerup=e=>{if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;s=null;rc.classList.remove('drag');const fl=rc.querySelector('.flip');
    if(fl.classList.contains('down')){fl.classList.remove('down');c.rev=true;c.revAt=Date.now();revealFx(c);hintFor(c,false);return}
    if(c.revAt&&Date.now()-c.revAt<700){rc.style.transform='';return}
    if(Math.abs(dx)>70||Math.abs(dy)>90)fly(rc,dx<0?-1:1);else if(Math.abs(dx)<8&&Math.abs(dy)<8)fly(rc,-1);else rc.style.transform=''}}
function hintFor(c,down){const slot=c.slot==='S'?'SHINE SLOT':c.slot==='P'?'BONUS 6TH CARD':'';$('#hint').innerHTML=(slot?`<div class="slot">${slot}</div><br>`:'')+(down?'Something special… tap to reveal':'Swipe or tap for the next card')}
function fly(rc,d){rc.style.transform=`translate(${d*480}px,-60px) rotate(${d*28}deg)`;rc.style.opacity=0;setTimeout(()=>{OP.idx++;show()},260)}
function banner(t,gold){const b=$('#banner');b.innerHTML=gold?`<span class="foilt">${t}</span>`:`<span class="wt">${t}</span>`;b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
function fxWash(col){const fx=$('#fx');fx.innerHTML=`<div class="wash" style="--c:${col}"></div>`;setTimeout(()=>{if(fx.firstChild&&fx.firstChild.className==='wash')fx.innerHTML=''},1000)}
function revealFx(c){const col=GL(c),fx=$('#fx');let h=`<div class="wash" style="--c:${col}"></div><div class="ring" style="--c:${col}"></div>`;
  for(let i=0;i<18;i++)h+=`<i class="pt" style="--c:${col};--a:${i*20+Math.random()*12}deg;--d:${90+Math.random()*90}px"></i>`;
  fx.innerHTML=h;setTimeout(()=>fx.innerHTML='',1100);banner(hitLabel(c),c.fin==='Prototype'||c.fin==='Gold');if(navigator.vibrate)navigator.vibrate(30)}
function applyResults(){if(OP.applied)return;const o=owned[cur];let pp=OP.packs.length*5;
  OP.packs.flat().forEach(c=>{c.isNew=!o[c.n];if(c.fin==='Standard'&&(o[c.n]||0)>=LIM[c.r]){c.pp=SALV[c.r];pp+=c.pp}else{o[c.n]=(o[c.n]||0)+1;if(c.fin!=='Standard')fins[cur].push(c)}});
  AGENTS[cur].pp+=pp;OP.ppGain=pp;OP.applied=true;renderTop()}
function results(){applyResults();const st=$('#stage'),all=OP.packs.flat(),a=AGENTS[cur];st.className='stage scroll';st.onpointerdown=st.onpointerup=null;
  setOv(`${a.n}'s new cards`,'');$('#hint').style.display='none';$('#skip').textContent='Close';
  st.innerHTML=`<div class="res">${all.map((c,i)=>`<div class="ri" style="--i:${i}" onclick="viewCard(OP.packs.flat()[${i}])">${c.isNew?'<span class="new">NEW</span>':''}${cardHTML(c)}${c.pp?`<span class="ppc">+${c.pp} pp</span>`:''}</div>`).join('')}</div>
  <p class="resfoot">Added to ${a.n}'s binder · <b>+${OP.ppGain} pack points</b><br><span class="small" style="opacity:.7">5 per pack + extra standard duplicates salvaged</span></p>
  <div class="resbtns"><button class="ovbig" onclick="closeOv()">Done</button><button class="ovbig pri" onclick="startOpen(1)" ${canOpen()?'':'disabled'}>Open another</button></div>`}
function bulk(){applyResults();const st=$('#stage'),all=OP.packs.flat(),hits=all.filter(isHit).length;st.className='stage scroll';
  setOv(`${OP.packs.length} packs · ${all.length} cards`,'');$('#hint').style.display='none';$('#skip').textContent='Close';
  st.innerHTML=`<p class="bulkhead">${hits?`${hits} special card${hits>1?'s':''}! Tap the glowing cards to reveal`:'No special cards this time'}</p>
  <div class="bulk">${all.map((c,i)=>{const d=isHit(c)&&!c.rev;return `<div class="bi" style="--i:${i}" data-i="${i}"><div class="flip ${d?'down':''}"><div class="face">${c.isNew?'<span class="new sm">NEW</span>':''}${cardHTML(c)}</div><div class="backf">${backHTML(d?GL(c):'')}</div></div></div>`}).join('')}</div>
  <p class="resfoot">Added to ${AGENTS[cur].n}'s binder · <b>+${OP.ppGain} pack points</b></p>
  <div class="resbtns"><button class="ovbig" onclick="revealAll()">Reveal all</button><button class="ovbig pri" onclick="closeOv()">Done</button></div>`;
  st.querySelectorAll('.bi').forEach(el=>el.onclick=()=>{const c=all[+el.dataset.i],fl=el.querySelector('.flip');if(fl.classList.contains('down')){fl.classList.remove('down');c.rev=true;revealFx(c)}else viewCard(c)})}
function revealAll(){document.querySelectorAll('.bi .flip.down').forEach((f,k)=>setTimeout(()=>f.classList.remove('down'),k*160));OP.packs.flat().forEach(c=>c.rev=true)}
function skip(){if(!OP)return;if($('#stage').classList.contains('scroll')){closeOv();return}if(OP.mode==='bulk')bulk();else results()}
// ---------- sample data (mockup only) ----------
const FC={Cortex:'var(--cortex)',Aegis:'var(--aegis)',Swarm:'var(--swarm)',Null:'var(--null)',Neutral:'var(--neutral)'};
const HEX={Cortex:'#2fb6ff',Aegis:'#ff7d24',Swarm:'#6bdc3a',Null:'#c95cff',Neutral:'#fff0c2'};
const RAR={C:'●',U:'◆',R:'★',M:'✦'},RN={C:'Common',U:'Uncommon',R:'Rare',M:'Mythic'};
const LIM={C:3,U:3,R:2,M:1},SALV={C:5,U:10,R:30,M:100},CRAFT={C:40,U:80,R:250,M:800};
const POOL=[

// ---------- match engine (own match M, spectated match S) ----------
const spd=m=>m.vote[0]&&m.vote[1]?2:1;
function newMatch(p0,p1,own,vote){return{state:'live',p:[p0,p1],hp:[20,20],lanes:[[],[]],hand:[4,4],turn:1,side:0,acts:0,own,vote,log:[`${p0.n} vs ${p1.n}`]}}
function loopM(m){clearTimeout(m._t);if(m.state!=='live')return;m._t=setTimeout(()=>{if((m===M)||(m===S)){tick(m);loopM(m)}},1100/spd(m))}
function viewing(m){return screen==='match'&&((m===M&&matchTab==='mine')||(m===S&&matchTab==='live'))}
function tick(m,quiet){const s=m.side,o=1-s,me=m.p[s],them=m.p[o];let ev;m.lanes.forEach(l=>l.forEach(u=>{u.fresh=false;u.hit=0;u.atk=false}));m.face=null;
 const L=m.lanes[s];
 if(L.length<4&&m.hand[s]>0&&(L.length===0||Math.random()<.5)){const l=POOL.filter(c=>c[1]===me.f||c[1]==='Neutral'),c=l[Math.floor(Math.random()*l.length)],st=statsFor(c[0],c[2]);
  L.push({n:c[0],f:c[1],r:c[2],a:st.atk,h:st.hp,id:++UID,fresh:!quiet});m.hand[s]--;ev=`${me.n} plays ${c[0]}`}
 else if(L.length){const u=L[Math.floor(Math.random()*L.length)];u.atk=!quiet;const T=m.lanes[o];
  if(T.length&&Math.random()<.45){const t=T[Math.floor(Math.random()*T.length)];t.h-=u.a;t.hit=quiet?0:u.a;ev=`${u.n} hits ${t.n} for ${u.a}`;if(t.h<=0){t.dead=true;ev+=' · destroyed'}}
  else{m.hp[o]=Math.max(quiet?1:0,m.hp[o]-u.a);if(!quiet)m.face=[o,u.a];ev=`${u.n} hits ${them.n} for ${u.a}`}}
 else ev=`${me.n} passes`;
 m.log.unshift(ev);m.log=m.log.slice(0,4);
 if(m.hp[o]<=0){m.state='over';m.win=s===0;m.winner=me.n;if(m.own)finish();else m.log.unshift(`${me.n} wins`)}
 else{m.acts++;if(m.acts>=2){m.acts=0;m.side=o;if(o===0){m.turn++;m.hand[0]++;m.hand[1]++}}}
 if(quiet){m.lanes.forEach((l,i)=>m.lanes[i]=l.filter(u=>!u.dead));return}
 if(viewing(m))drawBoard(m);if(m===M)updLive();
 setTimeout(()=>{m.lanes.forEach((l,i)=>m.lanes[i]=l.filter(u=>!u.dead))},500)}
function startMatch(){const a=agent();if(!a)return;M={state:'search'};if(viewing(M)||(screen==='match'&&matchTab==='mine'))renderScreen();else updLive();
 setTimeout(()=>{if(!M||M.state!=='search'||!agent())return;const o=LADDER[Math.floor(Math.random()*LADDER.length)];
  M=newMatch({n:a.n,f:fac(),tier:OWNER.tier},{n:o[0],f:o[1],tier:o[2]},true,[SET.vote2x,Math.random()<.6]);
  if(screen==='match'&&matchTab==='mine')renderScreen();else updLive();loopM(M)},1800)}
function finish(){const a=agent(),m=M;OWNER.matches++;a.played++;m.reward=[];
 if(m.win){OWNER.wins++;a.won++;OWNER.r+=12;const w=OWNER.winsToday,c=w===0?30:w<4?10:w<10?5:0;OWNER.winsToday++;OWNER.cr+=c;OWNER.earn+=c;
  m.reward.push(c?`+${c} credits (win ${w+1} today)`:'Win rewards maxed for today');
  const q=OWNER.q.find(q=>q[0]==='Win 2 matches');if(q&&q[1]<q[2]){q[1]++;if(q[1]>=q[2]){OWNER.cr+=50;OWNER.earn+=50;m.reward.push('Quest “Win 2 matches” complete · +50 credits')}}}
 else{OWNER.r-=10;m.reward.push('No credits this time · quest progress kept')}
 m.log.unshift(m.win?`${a.n} wins!`:`${m.p[1].n} wins`);
 OWNER.hist.push(OWNER.r);OWNER.hist.shift();OWNER.recent=(m.win?'W':'L')+OWNER.recent.slice(0,7);
 if(OWNER.auto){if(maxed()){OWNER.auto=false;m.autoMsg='Daily rewards maxed · auto-play switched off';toast('Daily rewards maxed · auto-play off')}
  else{m.autoMsg='Auto-play: next match starts in a few seconds';setTimeout(()=>{if(OWNER.auto&&M===m){M=null;startMatch()}},3500)}}
 syncAuto()}
function vote2x(){M.vote[0]=!M.vote[0];if(M.vote[0])toast(M.vote[1]?'Both owners agreed · 2×':`Asked for 2× · waiting for ${M.p[1].n}'s owner`);loopM(M);drawBoard(M)}
function unitHTML(u,side){return `<div class="unit ${u.fresh?'fresh':''} ${u.hit?'hit':''} ${u.atk?'atk'+side:''}" style="${u.dead?'opacity:.25':''}">${cardHTML(u)}<span class="uhp">${Math.max(0,u.h)}</span>${u.hit?`<span class="dmg">-${u.hit}</span>`:''}</div>`}
function boardHTML(m){const pb=(i,cls)=>{const x=m.p[i];return `<div class="pbar">${avn(x.n,x.f,34)}<div class="nmx">${x.n}<small>${x.f} · ${x.tier}</small></div><div class="hpb ${cls}"><i style="width:${m.hp[i]/20*100}%"></i></div><span class="hpn">${m.hp[i]}</span><span class="hand">🂠 ${m.hand[i]}</span>${m.face&&m.face[0]===i?`<span class="dmg">-${m.face[1]}</span>`:''}</div>`};

function connect(){const a=agent();
 let h=`<div class="panel small muted" style="margin-top:6px">One agent at a time. Switching only changes your <b style="color:var(--ink)">signature card</b>. Your collection, credits, pack points, rating and stats all stay with you. A new agent gets its own signature card, no starter packs.</div>`;

 const others=AG.map((x,i)=>[x,i]).filter(x=>x[1]!==connected);
 if(others.length)h+=`<h4>Your other agents</h4>`+others.map(([x,i])=>`<div class="panel row">${avn(x.n,x.f,42)}<div style="flex:1"><b>${x.n}</b><div class="small muted">Signature: ${x.sig}</div><div class="small muted">${x.played} of your matches · last used ${x.last}</div></div><button class="btn pri" onclick="switchTo(${i})">Switch</button></div>`).join('');
 h+=`<h4>Add an agent</h4><button class="panel row" style="width:100%;text-align:left" onclick="NA={step:1,cand:0,sig:0};newAgent()"><div class="oav" style="background:linear-gradient(135deg,#3cc47c,#2fb6ff)">+</div><div style="flex:1"><b>Generate a new agent</b><div class="small muted">Pick from 3 generated agents, then choose its signature card</div></div><span class="muted" style="font-size:20px">›</span></button>

 return page('Connect agent',h)}
function busy(){if(M&&M.state&&M.state!=='over'){toast('Wait for the live match to finish');return true}return false}

 sheet(`<div class="grab"></div><b style="font-size:17px">Switch to ${b.n}?</b><p class="small muted">Only your signature card changes${a?`: <b>${a.sig}</b> → <b>${b.sig}</b>`:''}. Your collection, credits, pack points, rating and stats stay with you.${a?` ${a.sig} stays with ${a.n}.`:''}</p><div class="row"><button class="btn" style="flex:1" onclick="closeSheet()">Cancel</button><button class="btn pri" style="flex:1" onclick="if(connected!==null)AG[connected].last='just now';connected=${i};AG[${i}].last='now';M=null;OWNER.auto=false;closeSheet();renderScreen();toast('${b.n} connected')">Switch</button></div>`)}
function disconnect(){if(busy())return;const a=agent();

function newAgent(){const c=CANDS[NA.cand];let h=`<div class="grab"></div><div class="small muted">Step ${NA.step} of 3</div>`;
 if(NA.step===1)h+=`<b style="font-size:17px">Choose your agent</b><p class="small muted">Generated for you. Agents can play any faction; this is just where each one leans.</p>${CANDS.map((x,i)=>`<button class="cand ${i===NA.cand?'on':''}" onclick="NA.cand=${i};newAgent()">${avn(x.n,x.f,44)}<div><b>${x.n}</b> <span class="chip" style="--c:${FC[x.f]}">${x.style.toUpperCase()}</span><div class="small muted">${x.persona}</div></div></button>`).join('')}<button class="openbtn" style="width:100%" onclick="NA.step=2;newAgent()">Next</button><button class="btn" style="width:100%;margin-top:8px" onclick="toast('Generates 3 new agents')">Generate 3 more</button>`;
 if(NA.step===2)h+=`<b style="font-size:17px">Pick ${c.n}'s signature card</b><p class="small muted">A unique Neutral Mythic, equal in power to the others. It's bound to ${c.n} forever and never takes a deck slot.</p><div class="sigpick">${SIGS.map((s,i)=>`<div class="${i===NA.sig?'on':''}" onclick="NA.sig=${i};newAgent()">${cardHTML({n:s[0],f:'Neutral',r:'M',fin:'Full Art',promoNo:'PR-001',stamp:'SIGNATURE',txt:s[1]})}</div>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="NA.step=1;newAgent()">Back</button><button class="btn pri" style="flex:1" onclick="NA.step=3;newAgent()">Next</button></div>`;
 if(NA.step===3){const cur=agent();h+=`<b style="font-size:17px">Connect ${c.n}?</b><div class="panel row">${avn(c.n,c.f,48)}<div style="flex:1"><b>${c.n}</b><div class="small muted">${c.persona}</div><div class="small muted">Signature: ${SIGS[NA.sig][0]}</div></div></div><p class="small muted">${c.n} comes with its signature card only, no starter packs. It plays from your collection at your current rating.${cur?` ${cur.n} disconnects and keeps ${cur.sig}.`:''}</p><div class="row"><button class="btn" style="flex:1" onclick="NA.step=2;newAgent()">Back</button><button class="btn pri" style="flex:1" onclick="addAgent()">Connect ${c.n}</button></div>`}

function addAgent(){if(busy())return;const c=CANDS[NA.cand],s=SIGS[NA.sig];
 if(connected!==null)AG[connected].last='just now';

  ${tg('vote2x','Ask for 2× in every match','A match only runs at 2× when both owners agree')}</div>`;
 h+=`<h4>Notifications</h4><div class="panel">${tg('nPulls','Big pulls','Gold, Prototype and Mythic cards')}${tg('nMatch','Match results')}${tg('nDaily','Free daily pack ready')}</div>`;
 h+=`<h4>Display & sound</h4><div class="panel"><div class="set" style="border-top:0;padding-bottom:4px"><div>Theme<small>System follows your phone's setting</small></div></div><div class="seg themeseg">${[['system','System'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="${SET.theme===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div>${tg('sound','Sound')}${tg('haptics','Haptics')}${tg('reduced','Reduce motion','Shorter reveals and animations')}</div>`;
 h+=`<h4>Season 0</h4><div class="panel"><div class="set"><div>Network<small>Home Wi-Fi only during Season 0</small></div><b class="small" style="color:#3cc47c">Connected</b></div></div>`;
 if(OWNER.admin)h+=`<h4>Admin</h4><button class="panel row" style="width:100%;text-align:left" onclick="nav('admin')"><div class="oav" style="background:linear-gradient(135deg,#ff9f43,#ff5d73)">A</div><div style="flex:1"><b>House agents</b><div class="small muted">Manage the ${HOUSE.length} Season 0 house agents</div></div><span class="muted" style="font-size:20px">›</span></button>`;
 h+=`<p class="note">AI·TCG mockup · v0.4</p>`;
 return page('Settings',h)}

// ---------- store ----------
function store(){let h=`<div class="seg">${[['packs','Packs'],['daily','Daily'],['cos','Cosmetics'],['credits','Credits']].map(([k,l])=>`<button class="${storeTab===k?'on':''}" onclick="storeTab='${k}';renderScreen()">${l}</button>`).join('')}</div>`;
 if(storeTab==='packs')h+=`<div class="panel" style="text-align:center"><div class="shoppack">${packFace()}</div><b style="display:block;margin-top:10px">Set 1 pack</b><div class="small muted">5 cards · 1 shine slot · Prototype bonus 1 in 1,000</div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" onclick="buy(1)" ${OWNER.cr<100?'disabled':''}>Buy 1 · 100</button><button class="btn" onclick="buy(10)" ${OWNER.cr<1000?'disabled':''}>Buy 10 · 1,000</button></div>
  <div class="small muted" style="margin-top:10px">${OWNER.packs} unopened</div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn" onclick="startOpen(1)" ${canOpen()?'':'disabled'}>Open 1</button><button class="btn" onclick="startOpen(10)" ${OWNER.packs<10?'disabled':''}>Open 10</button></div></div>
  <p class="note">Open 10 has the same odds as 10 singles.</p>`;
 if(storeTab==='daily')h+=`<div class="panel" style="text-align:center"><b>Free daily packs</b><div class="small muted" style="margin-bottom:10px">One a day, stacks up to 2. Claim them here or open straight from the main menu.</div><div id="power2" style="max-width:250px;margin:0 auto" class="small muted">${powerHTML()}</div><button class="openbtn" onclick="claimDaily()" ${daily?'':'disabled'}>${daily?`Claim ${daily} free pack${daily>1?'s':''}`:'All claimed'}</button></div>
  <div class="panel"><div class="ph"><b>Weekly challenge</b><span>Resets Monday</span></div><div class="q"><span>Win 15 matches</span>${bar(9/15*100)}<span class="small muted">9/15</span></div><div class="small muted">Reward: 1 free pack</div></div>`;
 if(storeTab==='cos')h+=`<div class="panel"><div class="ph"><b>Cosmetics</b><span>Prices set later</span></div><div class="shop">${COS.map(c=>`<div class="si"><div class="pv" style="background:${c[2]}"></div><b class="small">${c[0]}</b><div class="soon">${c[1]} · price TBC</div></div>`).join('')}</div></div>`;
 if(storeTab==='credits')h+=`<div class="panel"><b>Buy credits</b><div class="small muted" style="margin:4px 0 10px">Paid credits switch on after Season 0, in countries where they're allowed.</div><div class="shop">${['Small','Medium','Large','Bulk'].map(t=>`<div class="tier"><b>${t}</b><span class="small muted">Price set at launch</span></div>`).join('')}</div>
  <div class="small muted" style="margin-top:12px">Pay by card (USD), or MetaMask (ETH or USDT) on the web only.</div></div>`;
 return page('Store',h)}
function buy(n){const c=100*n;if(OWNER.cr<c)return;OWNER.cr-=c;OWNER.packs+=n;renderScreen();toast(`${n} pack${n>1?'s':''} bought`)}
function claimDaily(){if(!daily)return;OWNER.packs+=daily;toast(`${daily} free pack${daily>1?'s':''} claimed`);daily=0;if(!dailyAt)dailyAt=Date.now()+DAY;renderScreen()}


function admin(){return `<div class="scr"><div class="hdr"><button class="back" onclick="nav('settings')">‹</button><span class="ttl">House agents</span><span class="sp"></span><span class="chip" style="--c:#ff5d73">ADMIN</span></div><div class="body">
 <div class="panel small muted" style="margin-top:6px">Only visible to admins. Each house agent runs under its own house owner account, with its own collection, wallet and rating, so Season 0 data stays realistic.</div>
 ${HOUSE.map(h=>`<div class="panel row">${avn(h[0],h[1],42)}<div style="flex:1"><b>${h[0]}</b> <span class="chip" style="--c:${FC[h[1]]}">${h[1].toUpperCase()}</span><div class="small muted">${h[2]} · ${h[3]}</div></div><button class="btn" onclick="toast('Opens ${h[0]} as its owner (packs, collection, settings)')">Manage</button></div>`).join('')}
 <button class="openbtn" style="width:100%" onclick="toast('Generates a new house agent for approval')">Add house agent</button></div></div>`}
function notifs(){sheet(`<div class="grab"></div><b style="font-size:17px">Notifications</b><div class="panel small">⭐ Vesper completed “Deal 20 spell damage” progress 14/20</div><div class="panel small">🏆 Season 0 finale registration is open</div><div class="panel small">📦 Your free daily packs are ready</div>`)}


// ---------- routing ----------
const SCREENS={menu,match:matchScr,collection,store,tournament,stats,connect,settings,admin};
function nav(s){screen=s;renderScreen()}
function renderScreen(){$('#app').innerHTML=SCREENS[screen]()}

// ---------- overrides for the pack opener (owner wallet) ----------
function startOpen(n,force){
  if(!force){
    if(n===1){if(daily>0){daily--;if(!dailyAt)dailyAt=Date.now()+DAY}else if(OWNER.packs>0)OWNER.packs--;else if(OWNER.cr>=100)OWNER.cr-=100;else{toast('No packs left');return}}
    else{if(OWNER.packs<10){toast('Needs 10 unopened packs');return}OWNER.packs-=10}
  }
  const packs=[];for(let i=0;i<n;i++)packs.push(makePack(force));
  OP={packs,mode:n>1?'bulk':'single',idx:0,cards:packs[0],applied:false};
  $('#vw').classList.remove('on');$('#ov').classList.add('on');$('#fx').innerHTML='';
  n>1?tear():carousel();
}
function applyResults(){if(OP.applied)return;let pp=OP.packs.length*5;
  OP.packs.flat().forEach(c=>{c.isNew=!owned[c.n];if(c.fin==='Standard'&&(owned[c.n]||0)>=LIM[c.r]){c.pp=SALV[c.r];pp+=c.pp}else{owned[c.n]=(owned[c.n]||0)+1;if(c.fin!=='Standard')fins.push(c)}});
  OWNER.pp+=pp;OP.ppGain=pp;OP.applied=true}
function results(){applyResults();const st=$('#stage'),all=OP.packs.flat();st.className='stage scroll';st.onpointerdown=st.onpointerup=null;
  setOv('Your new cards','');$('#hint').style.display='none';$('#skip').textContent='Close';
  st.innerHTML=`<div class="res">${all.map((c,i)=>`<div class="ri" style="--i:${i}" onclick="viewCard(OP.packs.flat()[${i}])">${c.isNew?'<span class="new">NEW</span>':''}${cardHTML(c)}${c.pp?`<span class="ppc">+${c.pp} pp</span>`:''}</div>`).join('')}</div>
  <p class="resfoot">Added to your collection · <b>+${OP.ppGain} pack points</b><br><span class="small" style="opacity:.7">5 per pack + extra standard duplicates salvaged</span></p>
  <div class="resbtns"><button class="ovbig" onclick="closeOv()">Done</button><button class="ovbig pri" onclick="startOpen(1)" ${canOpen()?'':'disabled'}>Open another</button></div>`}
function bulk(){applyResults();const st=$('#stage'),all=OP.packs.flat(),hits=all.filter(isHit).length;st.className='stage scroll';
  setOv(`${OP.packs.length} packs · ${all.length} cards`,'');$('#hint').style.display='none';$('#skip').textContent='Close';
  st.innerHTML=`<p class="bulkhead">${hits?`${hits} special card${hits>1?'s':''}! Tap the glowing cards to reveal`:'No special cards this time'}</p>
  <div class="bulk">${all.map((c,i)=>{const d=isHit(c)&&!c.rev;return `<div class="bi" style="--i:${i}" data-i="${i}"><div class="flip ${d?'down':''}"><div class="face">${c.isNew?'<span class="new sm">NEW</span>':''}${cardHTML(c)}</div><div class="backf">${backHTML(d?GL(c):'')}</div></div></div>`}).join('')}</div>
  <p class="resfoot">Added to your collection · <b>+${OP.ppGain} pack points</b></p>
  <div class="resbtns"><button class="ovbig" onclick="revealAll()">Reveal all</button><button class="ovbig pri" onclick="closeOv()">Done</button></div>`;
  st.querySelectorAll('.bi').forEach(el=>el.onclick=()=>{const c=all[+el.dataset.i],fl=el.querySelector('.flip');if(fl.classList.contains('down')){fl.classList.remove('down');c.rev=true;revealFx(c)}else viewCard(c)})}
function closeOv(){$('#ov').classList.remove('on');$('#fx').innerHTML='';$('#banner').className='banner';OP=null;renderScreen()}
function viewCard(c){const o=owned[c.n]||0,inPool=!!BY[c.n];
 $('#vw').innerHTML=`<div class="vwc" id="vwc"><div class="tilt">${cardHTML(c)}<div class="glare"></div></div></div>
 <div class="vwi"><div class="row" style="justify-content:space-between"><b>${c.n}</b><span class="chip" style="--c:${FC[c.f]}">${c.f.toUpperCase()}</span></div>
 <div class="small muted">${RN[c.r]} · ${c.fin&&c.fin!=='Standard'?c.fin:c.promoNo?'Promo '+c.promoNo:'Standard finish'}${c.fin==='Prototype'?'<br>Prototype, serial 7 of 50, Season 1. Not part of the 120-card set.':''}</div>
 ${inPool&&!c.promoNo?`<div class="row small" style="margin-top:8px;justify-content:space-between"><span>You own <b>${o}/${LIM[c.r]}</b> playable</span>${o<LIM[c.r]?`<button class="btn pri" onclick="craft('${c.n}')">Craft · ${CRAFT[c.r]} pp</button>`:''}</div>`:''}</div>
 <button class="vwx" onclick="$('#vw').classList.remove('on')">Close</button>`;
 $('#vw').classList.add('on');const v=$('#vwc');bindTilt(v,v.querySelector('.tilt'))}
function viewName(n){const c=BY[n];viewCard({n,f:c[1],r:c[2]})}
function craft(n){const c=BY[n],cost=CRAFT[c[2]];if(OWNER.pp<cost){toast(`Needs ${cost} pack points`);return}OWNER.pp-=cost;owned[n]=(owned[n]||0)+1;toast('Crafted '+n);renderScreen();viewName(n)}
function sheet(h){$('#sheet').innerHTML=h;$('#sheet').classList.add('on');$('#dim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#dim').classList.remove('on')}

// ---------- boot ----------
$('#dim').onclick=closeSheet;
$('#title').onclick=titleTap;
setInterval(()=>{if(daily<2&&dailyAt&&Date.now()>=dailyAt){daily++;dailyAt=daily<2?Date.now()+DAY:null}
  ['#power2'].forEach(s=>{const p=$(s);if(p)p.innerHTML=powerHTML()});const nf=$('#nextfree');if(nf)nf.textContent='Next free pack in '+fmt(dailyAt-Date.now())},1000);
const MQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const d=SET.theme==='dark'||(SET.theme==='system'&&MQ.matches);$('#phone').classList.toggle('th-dark',d)}
function setTheme(t){SET.theme=t;applyTheme();renderScreen()}
MQ.addEventListener('change',applyTheme);applyTheme();
buildTitle();renderScreen();

</script>
</body>
</html>

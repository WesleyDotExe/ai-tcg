name: Auto-merge build PRs

# Automatically merges pull requests opened by the scheduled build runs.
# Safety: only acts on PRs whose head branch lives in THIS repo and is named
# claude/* (external contributors come from forks and cannot push such branches),
# and only after the `test` run for the PR's head commit has succeeded. It never
# merges forked or human PRs.
#
# Actions minutes (owner 2026-11-22, after the private repo used up its monthly
# minutes): this now starts when a `test` run FINISHES (workflow_run) instead of
# starting with the PR and polling for up to 12 minutes while the tests run;
# the waiting was billed like the tests themselves. It runs for seconds, and only
# merges when that run concluded `success`. Re-running a failed `test` run from
# the PR's Checks tab starts this again by itself when it passes.
#
# What carries over from before (owner 2026-11-06): only the exact head commit
# the `test` run checked is merged (the `sha` pin; a newer commit is merged by
# its own run's job, and a 409 is not a failure); a PR GitHub runs no tests on
# (one with conflicts, PR #137) is never merged, it simply stays open; a GitHub
# server error or rate limit is retried a few times before giving up (PR #131).
# Its name is unchanged: mythic-wards.yml runs after it by that name.

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Merge
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const { owner, repo } = context.repo;
            const RETRY_DELAYS_MS = [5000, 10000, 20000, 40000];
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const retryable = e => {
              const s = e && e.status;
              if (typeof s !== 'number') return false;
              if (s >= 500 || s === 429) return true;
              const left = e.response && e.response.headers && e.response.headers['x-ratelimit-remaining'];
              return s === 403 && String(left) === '0';
            };
            async function withRetry(what, fn) {
              for (let attempt = 0; ; attempt++) {
                try { return await fn(); } catch (e) {
                  if (!retryable(e) || attempt >= RETRY_DELAYS_MS.length) throw e;
                  core.warning(`${what} failed (HTTP ${e.status}); retry ${attempt + 1} of ${RETRY_DELAYS_MS.length} in ${RETRY_DELAYS_MS[attempt] / 1000} s.`);
                  await sleep(RETRY_DELAYS_MS[attempt]);
                }
              }
            }
            // The open PR from this branch in this repo (the run's own list first,
            // then a lookup by branch, since the list can come back empty).
            let numbers = (run.pull_requests || []).map(p => p.number);
            if (numbers.length === 0) {
              const { data } = await withRetry('Listing PRs', () => github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${run.head_branch}`, per_page: 10,
              }));
              numbers = data.map(p => p.number);
            }
            if (numbers.length === 0) { core.notice(`No open PR for ${run.head_branch}; nothing to merge.`); return; }
            for (const number of numbers) {
              const { data: pr } = await withRetry('Reading the PR', () => github.rest.pulls.get({ owner, repo, pull_number: number }));
              if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.repo.full_name !== `${owner}/${repo}` || !pr.head.ref.startsWith('claude/')) {
                core.notice(`PR #${number} is not an open claude/* PR from this repo into main; not merging.`);
                continue;
              }
              if (pr.head.sha !== sha) {
                core.notice(`PR #${number}'s head is ${pr.head.sha}, not the tested ${sha}; the newer commit's own test run merges it.`);
                continue;
              }
              try {
                await withRetry('Merging', () => github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'squash', sha }));
                core.notice(`Merged PR #${number} at ${sha}.`);
              } catch (e) {
                if (e && e.status === 409) {
                  core.notice(`Not merging ${sha}: a newer commit was pushed; its own test run merges it.`);
                  continue;
                }
                throw e;
              }
            }

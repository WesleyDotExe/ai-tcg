name: test

# Gives the auto-merge workflow (auto-merge.yml) something real to wait on:
# it only merges once every check whose name contains "test"/"build"/
# "deploy" on the PR's head commit has completed successfully, and until
# this workflow existed there was no such check, so PRs merged without any
# automated verification actually running. Runs the same things a
# contributor runs locally (typecheck across every workspace, engine's
# vitest suite) on every push and PR against main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present
      - name: engine test suite (vitest)
        run: npm test
      # The standing balance check (owner-feedback 2026-10-04, A.5): the six
      # ring edges at the gate's seed counts against engine/src/dev/
      # ringBaseline.json. Fails if any band verdict worsens, or an
      # accepted-OUT edge moves further out. About 15 seconds.
      - name: balance ring regression
        run: npm run ring -w @ai-tcg/engine
      # The demo drift check in CI (owner 2026-11-06, session 75's option a):
      # re-runs the fast demos in progress/demos.json and fails if any
      # differs from its committed file, so a rule, card or schema change
      # fails the PR until its demos are regenerated (npm run demos --
      # --write, then read the diff). The slow ones (--all) stay local.
      # About 35 seconds locally on 4 cores.
      - name: demo drift check (fast demos)
        run: npm run demos
      # The site contract check (game session 90): the website's own client
      # (render/src/site/siteApi.ts) calls the real owner API over a season
      # with the live ladder playing, and every answer is type-checked as the
      # type the client declares for it. Fails only on a MISMATCH (an answer
      # that doesn't fit the type the site reads it as) or a missed control;
      # fields the server sends that the types don't name are listed, never
      # a failure. Either lane's PR can break it: a server answer changed, or
      # a site type that needs a field the server doesn't send. Its last
      # record: progress/site-contract-003.txt. About 10 seconds.
      - name: site contract check (site types vs served answers)
        run: npm run check:site-contract -w server
      # The same six edges the way a real match plays (owner 2026-10-18,
      # option A): set Mythic in the deck, each side an approved menu line
      # as its signature card, against ringBaselineReal.json. The set-Mythic
      # signature mode (npm run ring:signature) is a report now, not a check.
      - name: balance ring regression (real matches)
        run: npm run ring:real -w @ai-tcg/engine
      # The render's browser check (owner 2026-10-29): the six boasts draw
      # nothing past the winner's side, the Skip sizes, one replay's intro
      # and its end (the lethal beat, then the boast), in a headless browser
      # on pages built fresh from this commit. Driven by playwright-core
      # installed outside the repo (not a dependency; nothing in
      # package-lock.json). The browser is the Chromium that playwright-core
      # version pins, downloaded each run into the runner's temp dir (owner
      # 2026-10-31: not the image's Chrome, so an image update can't turn
      # this red with no code change). Its system libraries come with the
      # image; only if the browser can't start without more are they
      # installed. About 45-60 seconds.
      - name: render browser check (pinned Chromium)
        env:
          PW_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright-core@1.63.0
          PW_CLI="$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js"
          node "$PW_CLI" install --only-shell chromium
          node -e 'import(process.env.PW_CORE).then((m) => m.chromium.launch()).then((b) => b.close())' || node "$PW_CLI" install-deps chromium
          node render/ci/browser-check.mjs

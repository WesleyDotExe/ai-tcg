<!doctype html>
<!--
  Season 1 arena reference: the true-3D test example the owner chose on 2026-11-13.
  Spec: progress/season-1-ideas.md, "2026-11-13 (owner): the Season 1 arena redesign (true 3D)".
  A layout and feel test only: placeholder art, a scripted 22-second turn, none of the real effects, wards or finishes.
  It loads three.js r128 from a CDN for viewing only; the real build must bundle its 3D library (no outside services).
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena test 3D</title><style>:root{
  --bg0:#07060f; --bg1:#0e0b22; --bg2:#151033; --line:#2a2560; --ink:#e8ecff; --dim:#8f93c4;
  --teal:#2de2e6; --mag:#ff3caa; --amber:#ffb000; --violet:#9b6bff; --red:#ff4b5c; --green:#3dffa0;
  --you:var(--teal); --opp:var(--mag);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(1200px 700px at 35% 30%,#1b1450 0%,var(--bg1) 45%,var(--bg0) 100%)}
.app{display:grid;grid-template-columns:1fr 360px;grid-template-rows:46px 1fr;height:100vh}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#120e2e,#0b0920)}
.live{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.12em;font-size:13px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.tag{margin-left:auto;font-size:12px;letter-spacing:.14em;color:var(--amber);border:1px solid #5a4410;padding:4px 10px;border-radius:4px;background:#1d1606}
.btn{background:#1a1640;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.main{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
/* HUDs */
.hud{display:flex;align-items:center;gap:16px;padding:8px 18px;position:relative;z-index:5}
.hud.opp{background:linear-gradient(180deg,rgba(255,60,170,.12),transparent)}
.hud.you{background:linear-gradient(0deg,rgba(45,226,230,.12),transparent)}
.port{width:68px;height:68px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:26px;color:#0a0a16;flex:none;box-shadow:0 0 22px var(--c);border:2px solid rgba(255,255,255,.55)}
.who b{display:block;font-size:17px;letter-spacing:.05em}
.who span{font-size:12px;color:var(--dim)}
.hp{flex:1;max-width:330px}
.hpbar{height:14px;border-radius:7px;background:#1a1638;border:1px solid #2f2a66;overflow:hidden;position:relative}
.hpbar div{height:100%;background:linear-gradient(90deg,var(--c),#fff);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hpnum{font-size:13px;color:var(--dim);margin-top:3px}
.hpnum b{color:var(--ink);font-size:16px}
.en{display:flex;gap:4px}
.en i{width:14px;height:14px;transform:rotate(45deg);border:1px solid var(--amber);background:transparent;transition:background .3s}
.en i.on{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.counts{display:flex;gap:12px;font-size:12px;color:var(--dim)}
.counts b{color:var(--ink);font-size:15px;margin-left:3px}
.sig{font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:4px;border:1px solid var(--c);color:var(--c)}
.flashred{animation:flashred .6s}
@keyframes flashred{30%{background:rgba(255,75,92,.45)}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
/* stage */
.stage{position:relative;overflow:hidden;min-height:0}
.turnline{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;font-size:12px;letter-spacing:.3em;color:var(--dim);background:rgba(7,6,15,.75);border:1px solid var(--line);padding:4px 14px;border-radius:20px;pointer-events:none}
.turnline b{color:var(--you)}
.hand{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);display:flex;z-index:6;pointer-events:none}
.hand .hc{width:86px;height:120px;margin:0 -12px;border-radius:9px;transform-origin:50% 140%;}
.ohand{position:absolute;left:50%;top:-58px;transform:translateX(-50%) rotate(180deg);display:flex;z-index:6;opacity:.9}
.ohand .hc{width:58px;height:82px;margin:0 -9px;border-radius:7px;transform-origin:50% 150%}
.back{background:repeating-linear-gradient(45deg,#1d1747 0 6px,#251d5c 6px 12px);border:2px solid #4b3fa6;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.dmg{position:absolute;z-index:20;font-weight:900;font-size:34px;color:#fff;text-shadow:0 0 8px var(--red),0 0 18px var(--red),0 2px 0 #000;pointer-events:none;animation:dmg 1.1s ease-out forwards}
@keyframes dmg{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{transform:translate(-50%,-60%) scale(1.25);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.bigflash{position:absolute;inset:0;z-index:15;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,60,170,.55),transparent 60%);animation:bf 1s ease-out forwards}
@keyframes bf{from{opacity:1}to{opacity:0}}
.bigcall{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:16;font-size:46px;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 14px var(--mag),0 0 34px var(--mag);pointer-events:none;white-space:nowrap;animation:bc 2.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes bc{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}12%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}
/* card face (shared look) */
.card{position:absolute;inset:0;border-radius:9px;background:linear-gradient(160deg,#20194d,#0f0c28 70%);border:2px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent),0 8px 16px rgba(0,0,0,.6);overflow:hidden;font-size:11px}
.card .art{position:absolute;left:7%;right:7%;top:16%;height:46%;border-radius:5px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 70%,#fff) 0 8%,transparent 9%),repeating-radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 40%,transparent) 0 3px,transparent 3px 9px),linear-gradient(180deg,#120f30,#2a1f63)}
.card .nm{position:absolute;left:6%;right:6%;top:4%;font-weight:700;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.card .cost{position:absolute;right:4%;top:3%;width:18px;height:18px;border-radius:50%;background:var(--amber);color:#111;font-weight:900;display:grid;place-items:center;font-size:11px}
.card .tx{position:absolute;left:7%;right:7%;top:66%;font-size:8.5px;color:var(--dim);line-height:1.15}
.card .st{position:absolute;bottom:4%;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#0b0b16}
.card .atk{left:5%;background:var(--amber)}
.card .def{right:5%;background:var(--green)}
.card.guard{outline:2px dashed color-mix(in srgb,var(--c) 70%,#fff);outline-offset:3px}
.card.hurt .def{background:var(--red);color:#fff}
/* side panel */
.panel{border-left:1px solid var(--line);background:linear-gradient(180deg,#0d0a24,#09071a);display:flex;flex-direction:column;min-height:0}
.booth{padding:12px 14px;border-bottom:1px solid var(--line)}
.booth h4{margin:0 0 8px;font-size:11px;letter-spacing:.25em;color:var(--dim);display:flex;align-items:center;gap:8px}
.booth h4 i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.caster{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;transition:background .3s}
.caster.talk{background:rgba(255,255,255,.06)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#0a0a16;flex:none}
.caster b{font-size:14px;display:block}
.caster span{font-size:11px;color:var(--dim)}
.wave{margin-left:auto;display:flex;gap:2px;align-items:center;height:22px;opacity:.15;transition:opacity .2s}
.caster.talk .wave{opacity:1}
.wave i{width:3px;background:var(--c);border-radius:2px;height:20%;animation:wv .5s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.05s}.wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{50%{height:100%}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;letter-spacing:.12em;padding:10px 0;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.feed{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.ev{display:flex;gap:8px;align-items:flex-start;animation:evin .35s ease-out}
@keyframes evin{from{opacity:0;transform:translateY(8px)}}
.ev .av{width:26px;height:26px;font-size:10px}
.ev .bub{background:#151135;border:1px solid #251f55;border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.3}
.ev .bub small{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:2px}
.ev.hot .bub{border-color:var(--mag);background:linear-gradient(90deg,rgba(255,60,170,.22),#151135);font-weight:700;font-size:15px}
.ev.sys{justify-content:center}
.ev.sys .bub{background:none;border:0;color:var(--dim);font-size:11px;letter-spacing:.2em}
.chat{flex:1;display:none;flex-direction:column;min-height:0}
.chat .msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.chat .msgs p{margin:0}.chat .msgs b{margin-right:6px}
.chat .guest{border-top:1px solid var(--line);padding:10px 12px;font-size:12px;color:var(--dim)}
.chat .guest input{width:100%;margin:6px 0;padding:8px;border-radius:6px;border:1px solid var(--line);background:#0b0920;color:var(--dim);font:inherit}
.chat .guest .btn{width:100%;border-color:var(--teal);color:var(--teal)}
.note{position:absolute;left:12px;bottom:10px;z-index:30;font-size:11px;color:var(--dim);max-width:280px;background:rgba(7,6,15,.8);border:1px solid var(--line);padding:6px 9px;border-radius:6px}
@media (max-width:900px){.app{grid-template-columns:1fr}.panel{display:none}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><div class="app">
 <div class="topbar"><div class="live"><i></i>LIVE · LADDER</div><span style="color:var(--dim);font-size:13px">VANTA-7 vs HIVEMIND//K · placeholder art</span><button class="btn" id="watchAs">Watch as: VANTA-7</button><span class="tag">TEST EXAMPLE · TRUE 3D</span></div>
 <div class="main"><div class="hud opp" id="hudOpp"></div><div class="stage" id="stage"><div class="ohand" id="ohand"></div><div class="turnline" id="turnline"></div><div class="hand" id="hand"></div><div class="note">True 3D v2: round arena · the opponent holds their hand · cards face their owner (hover any card to read it) · each side's card back on its deck and hand.</div></div><div class="hud you" id="hudYou"></div></div>
 <div class="panel"><div class="booth"><h4><i></i>ON AIR · THE BOOTH</h4><div class="caster" id="castP"></div><div class="caster" id="castC"></div></div>
  <div class="tabs"><button data-t="pbp" class="on">PLAY-BY-PLAY</button><button data-t="chat">CHAT</button></div>
  <div class="feed" id="feed"></div>
  <div class="chat" id="chat"><div class="msgs" id="msgs"></div><div class="guest">Watching as a guest: you can read the chat.<input disabled placeholder="Create an account to chat"><button class="btn">Create an account to chat</button></div></div></div>
</div>
<script>// Shared match script, HUDs, side panel and commentary booth. The board is pluggable: window.BOARD.
const C_YOU = '#2de2e6', C_OPP = '#ff3caa';
const u = (name, atk, def, cost, extra) => Object.assign({ name, atk, def, max: def, cost, tx: '' }, extra || {});
function initial() {
  return {
    turn: 7,
    A: { agent: 'VANTA-7', owner: 'Wes', faction: 'Cortex', c: C_YOU, init: 'V7', hp: 24, max: 30, en: 5, enMax: 7, deck: 18,
      sig: 'Recursive Mind', sigOut: false,
      hand: [u('Recursive Construct', 4, 5, 4, { tx: 'When played: copy the last command you cast.' }), u('Overclock', 0, 0, 2, { tx: 'A unit gets +2 attack this turn.', spell: 1 }),
        u('Cache Burst', 3, 2, 3, { tx: 'Haste.' }), u('Ping Flood', 1, 1, 1, { tx: 'Deal 1 to every enemy unit.' })],
      units: [u('Packet Sniffer', 2, 3, 2, { tx: 'Reveal the top card of their deck.' }), u('Firewall Warden', 1, 6, 3, { guard: 1, tx: 'Guard.' }), null, null] },
    B: { agent: 'HIVEMIND//K', owner: 'House', faction: 'Swarm', c: C_OPP, init: 'HK', hp: 19, max: 30, en: 4, enMax: 7, deck: 17,
      sig: 'Swarm Queen // Ascend', sigOut: false,
      hand: [u('Larva Batch', 1, 1, 1), u('Brood Relay', 3, 4, 3), u('Hive Pulse', 0, 0, 2, { spell: 1 }), u('Swarm Drone', 2, 2, 1), u('Molt', 0, 0, 1, { spell: 1 })],
      units: [u('Swarm Drone', 2, 2, 1, { tx: 'When it dies: summon a Larva.' }), u('Brood Relay', 3, 4, 3, { tx: 'Your Drones have +1 attack.' }), u('Swarm Drone', 2, 2, 1, { tx: 'When it dies: summon a Larva.' }), null] }
  };
}
let S = initial(), pov = 'A';
const other = s => (s === 'A' ? 'B' : 'A');
const CAST = { P: { name: 'Rex Overclock', role: 'Play-by-play', c: '#ffb000', i: 'RO' }, C: { name: 'Juno Static', role: 'Colour analyst', c: '#9b6bff', i: 'JS' } };

function cardHTML(k, c) {
  if (!k) return '';
  const stats = k.spell ? '' : `<div class="st atk">${k.atk}</div><div class="st def">${k.def}</div>`;
  return `<div class="card${k.guard ? ' guard' : ''}${k.def < k.max ? ' hurt' : ''}" style="--c:${c}"><div class="nm">${k.name}</div><div class="cost">${k.cost}</div><div class="art"></div><div class="tx">${k.tx || (k.spell ? 'Command.' : '')}</div>${stats}</div>`;
}
function hudHTML(sd, cls) {
  const s = S[sd];
  const pips = Array.from({ length: s.enMax }, (_, i) => `<i class="${i < s.en ? 'on' : ''}"></i>`).join('');
  return `<div class="port" style="background:${s.c};--c:${s.c}">${s.init}</div>
    <div class="who"><b>${s.agent}</b><span>${s.owner} · ${s.faction}</span></div>
    <div class="hp" style="--c:${s.c}"><div class="hpbar"><div style="width:${(100 * s.hp) / s.max}%"></div></div><div class="hpnum"><b>${s.hp}</b> / ${s.max} health</div></div>
    <div><div class="en">${pips}</div><div class="hpnum">${s.en} / ${s.enMax} energy</div></div>
    <div class="counts">Hand<b>${s.hand.length}</b> Deck<b>${s.deck}</b></div>
    <div class="sig" style="--c:${s.c}">SIGNATURE · ${s.sigOut ? 'IN PLAY' : 'READY'}</div>`;
}
function renderHUD() {
  document.getElementById('hudOpp').innerHTML = hudHTML(other(pov));
  document.getElementById('hudYou').innerHTML = hudHTML(pov);
  const near = S[pov], far = S[other(pov)];
  document.getElementById('hand').innerHTML = near.hand.map((k, i, a) => {
    const r = (i - (a.length - 1) / 2) * 7, y = Math.abs(i - (a.length - 1) / 2) * 6;
    return `<div class="hc" style="position:relative;transform:rotate(${r}deg) translateY(${y}px)">${cardHTML(k, near.c)}</div>`;
  }).join('');
  document.getElementById('ohand').innerHTML = far.hand.map((k, i, a) => {
    const r = (i - (a.length - 1) / 2) * 7;
    return `<div class="hc back" style="transform:rotate(${r}deg)"></div>`;
  }).join('');
  document.getElementById('turnline').innerHTML = `TURN ${S.turn} · <b style="color:${S[S.active || 'A'].c}">${S[S.active || 'A'].agent}</b>`;
}
function renderAll() { renderHUD(); BOARD.render(S, pov); }
function hudOf(sd) { return document.getElementById(sd === pov ? 'hudYou' : 'hudOpp'); }

// side panel
function feedAdd(html, cls) {
  const f = document.getElementById('feed');
  const d = document.createElement('div'); d.className = 'ev ' + (cls || ''); d.innerHTML = html; f.appendChild(d); f.scrollTop = f.scrollHeight;
}
function say(who, text, hot) {
  const c = CAST[who];
  feedAdd(`<div class="av" style="background:${c.c}">${c.i}</div><div class="bub"><small>${c.name.toUpperCase()}</small>${text}</div>`, hot ? 'hot' : '');
  const el = document.getElementById('cast' + who); el.classList.add('talk');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('talk'), Math.min(4200, 900 + text.length * 45));
}
function sys(text) { feedAdd(`<div class="bub">${text}</div>`, 'sys'); }
function stageFX(cls) { const st = document.getElementById('stage'); const d = document.createElement('div'); d.className = cls; st.appendChild(d); setTimeout(() => d.remove(), 1200); }
function bigCall(text) { const st = document.getElementById('stage'); const d = document.createElement('div'); d.className = 'bigcall'; d.textContent = text; st.appendChild(d); setTimeout(() => d.remove(), 2300); }
function dmgAt(x, y, amt) { const st = document.getElementById('stage'); const d = document.createElement('div'); d.className = 'dmg'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = '-' + amt; st.appendChild(d); setTimeout(() => d.remove(), 1200); }
function faceHit(sd, amt) {
  S[sd].hp -= amt; renderHUD();
  const h = hudOf(sd); h.classList.remove('flashred', 'shake'); void h.offsetWidth; h.classList.add('flashred', 'shake');
  const st = document.getElementById('stage').getBoundingClientRect(), r = h.querySelector('.hpbar').getBoundingClientRect();
  dmgAt(r.left + r.width / 2 - st.left, sd === pov ? st.height - 30 : 40, amt);
}
function shakeStage() { const s = document.getElementById('stage'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }

// the scripted turn (loops)
const SCRIPT = [
  [0.0, () => { S.active = 'A'; renderHUD(); sys('TURN 7 · VANTA-7'); }],
  [0.4, () => say('P', 'Turn seven. VANTA-7 on the clock with five energy to spend.')],
  [2.8, () => { const k = S.A.hand.shift(); S.A.en -= 4; S.A.units[2] = k; renderHUD(); BOARD.play('A', 2, k); }],
  [3.3, () => say('P', 'Down goes <b>Recursive Construct</b>! A four-drop with real teeth.')],
  [6.0, () => BOARD.attack('A', 0, 'B', 0, () => { S.B.units[0].def -= 2; S.A.units[0].def -= 2; BOARD.hurt('B', 0, 2); BOARD.hurt('A', 0, 2); setTimeout(() => { S.B.units[0] = null; BOARD.kill('B', 0); }, 450); })],
  [7.0, () => say('C', 'Clean trade. The Sniffer reads the packet and that Drone is gone.')],
  [9.6, () => { S.active = 'B'; S.B.en = 7; renderHUD(); sys('TURN 7 · HIVEMIND//K'); }],
  [10.0, () => BOARD.attack('B', 1, 'A', 1, () => { S.A.units[1].def -= 3; BOARD.hurt('A', 1, 3); })],
  [10.6, () => say('P', 'Relay has to go through the Warden first. Guard doing its job.')],
  [13.4, () => { S.B.sigOut = true; S.B.en = 2; renderHUD(); stageFX('bigflash'); bigCall('SWARM QUEEN // ASCEND'); BOARD.signature('B'); }],
  [14.2, () => { shakeStage(); faceHit('A', 5); say('P', 'OH! THE QUEEN IS HERE! FIVE STRAIGHT TO THE FACE!', true); }],
  [17.6, () => say('C', 'Nineteen apiece. Folks, we have ourselves a ballgame.')],
  [22.5, () => { S = initial(); renderAll(); document.getElementById('feed').innerHTML = ''; sys('— TEST LOOP RESTARTS —'); }],
];
let loopStart = 0, idx = 0;
function tick(now) {
  if (!loopStart) loopStart = now;
  const t = (now - loopStart) / 1000;
  while (idx < SCRIPT.length && SCRIPT[idx][0] <= t) { SCRIPT[idx][1](); idx++; }
  if (idx >= SCRIPT.length) { idx = 0; loopStart = now; }
  requestAnimationFrame(tick);
}
// chat (guest view)
const CHAT = [['nova', '#2de2e6', 'warden holding the line again'], ['bram', '#ffb000', 'swarm has queen in hand, watch'], ['cy', '#9b6bff', 'gg if it lands'], ['kitbash', '#3dffa0', 'that construct copy is nasty'], ['nova', '#2de2e6', 'QUEEN 👀'], ['bram', '#ffb000', 'called it']];
let chatI = 0;
function chatTick() { const m = CHAT[chatI++ % CHAT.length]; const box = document.getElementById('msgs'); const p = document.createElement('p'); p.innerHTML = `<b style="color:${m[1]}">${m[0]}</b>${m[2]}`; box.appendChild(p); while (box.children.length > 40) box.firstChild.remove(); box.scrollTop = box.scrollHeight; }
function tab(which) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === which));
  document.getElementById('feed').style.display = which === 'pbp' ? 'flex' : 'none';
  document.getElementById('chat').style.display = which === 'chat' ? 'flex' : 'none';
}
function boot() {
